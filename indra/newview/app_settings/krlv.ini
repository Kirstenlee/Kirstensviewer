; S24 - auto-converted from settings.xml, category: krlv


[Boolean]
; KRLV Control: user has enabled KRLV (RLVa) restrictions after reading the warning.
KRLVControlEnabled=0
; Enable KRLV (RLVa command support). Off by default - RLV is opt-in, scripted objects cannot control the viewer until this is turned on.
KRLVEnabled=0
; Internal KRLV tamper-evidence marker - set true whenever the owner list is saved with at least one owner. Not user-facing; do not edit by hand.
KRLVOwnersWereSet=0
; Internal KRLV tamper-evidence marker - set true whenever krlv_restrictions.dat is saved with at least one active restriction. Not user-facing; do not edit by hand.
KRLVRestrictionsWereActive=0

[F32]
; KRLV auto-response: minimum seconds before the same sender is answered again. Floor of 60.
KRLVAutoResponseCooldownSeconds=600.0
; KRLV Control: seconds the floater may stay minimised before the PIN lock re-engages. Closing it always re-locks.
KRLVControlLockSeconds=120.0
; KRLV owner notices: minimum seconds between notices of the same kind. Repeats in between are held back and summarised. Floor of 5.
KRLVNoticeIntervalSeconds=60.0

[String]
; KRLV auto-response: sent as an IM once per sender, per cooldown, when @recvchat drops their chat line.
KRLVAutoResponseChatText=I cannot receive chat right now, so I may not see your message. Please send an IM instead.
; KRLV auto-response: sent once per sender, per cooldown, when @recvim drops their IM.
KRLVAutoResponseIMText=I cannot read IMs right now (KRLV is restricting this). I will reply when I can.
; KRLV Control: salted hash of the PIN. Empty means no PIN is set.
KRLVControlPinHash=
; KRLV Control: salt used with the PIN hash, regenerated on each PIN change.
KRLVControlPinSalt=
; KRLV integrity: per-install random key for state-file signatures. Created once, never shared. Changing it makes existing signed files fail their check.
KRLVIntegrityKey=
; KRLV tamper checks: written-at time (unix seconds, as text) of the newest owner file this viewer saved. Used to detect an older copy being restored.
KRLVOwnersWrittenEpoch=
; KRLV safeword: salted hash of the three-word phrase. Empty means no safeword is set. Never stored in plain text.
KRLVSafewordHash=
; KRLV safeword: salt for the safeword hash, regenerated each time the safeword is set.
KRLVSafewordSalt=
; KRLV tamper checks: incidents already reported to owners, so each is announced once.
KRLVTamperNotifiedKeys=
