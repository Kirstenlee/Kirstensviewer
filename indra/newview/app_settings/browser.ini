; S24 - auto-converted from settings.xml, category: browser


[Boolean:NoPersist]
; (WARNING: Advanced feature. Use if you are aware of the implications). Enable or disable the viewer to Javascript bridge object.
BrowserEnableJSObject=0

[Boolean]
; Allow access to local files via file urls in the embedded browser
BrowserFileAccessFromFileUrls=1
; FOR TESTING ONLY: Tell the built-in web browser to ignore SSL cert errors.
BrowserIgnoreSSLCertErrors=0
; Enable Javascript in the built-in Web browser?
BrowserJavascriptEnabled=1
; Enable Web plugins in the built-in Web browser?
BrowserPluginsEnabled=1
; Use Web Proxy
BrowserProxyEnabled=0
; Enables the Websocket JSONRPC server when doing external script editing.
ExternalWebsocketSyncEnable=1
; Should the JSONRPC server listen only for local connections.
ExternalWebsocketSyncLocal=1
; S24: declared for the setting the code actually reads via LLCachedControl -- not present in upstream's own settings.xml (a real upstream inconsistency), added here so it's a real persisted/configurable setting rather than relying on the undeclared-key fallback default.
ExternalWebsocketSyncTightIntegration=0
; Enable/disable access to the local file system via the file picker
LocalFileSystemBrowsingEnabled=1
; If true, attach a debugger session to each plugin process as it's launched.
PluginAttachDebuggerToPlugins=0
; S24 - disables CEF's GPU process for every CEF/Dullahan browser instance, dropping one subprocess per instance. Viewer web UI (profile/search/marketplace/help, media-on-a-prim web pages) is not GPU-compositing-dependent. On by default - takes effect for newly-created media instances.
PluginDisableGPU=1
; Use a separate thread to read incoming messages from plugins
PluginUseReadThread=0

[F32]
; Amount of total plugin CPU usage before inworld plugins start getting turned down to "slideshow" priority.  Set to 0 to disable this check.
PluginInstancesCPULimit=0.9

[S32]
; Port for Web Proxy
BrowserProxyPort=3128
; Port that the JSONRPC server listens on when editing
ExternalWebsocketSyncPort=9020
; Maximum number of web browser windows that can be open at once in the Web content floater (0 for no limit)
WebContentWindowLimit=5

[String]
; Address for the Web Proxy]
BrowserProxyAddress=

[U32:NoPersist]
; Enable CEF remote debugging on the specified base port (1024 to 65535, 0 to disable). Each new SLPlugin gets base+N.
CEFRemoteDebuggingPort=0

[U32]
; Limit on the number of inworld media plugins that will run at "low" priority
PluginInstancesLow=4
; Limit on the number of inworld media plugins that will run at "normal" or higher priority
PluginInstancesNormal=2
; Hard limit on the number of plugins that will be instantiated at once for inworld media
PluginInstancesTotal=8
; S24 - hard limit on the number of CEF/Dullahan plugin instances used by viewer UI (profile panels, search, marketplace, web/help browser, popout floaters). Unlike PluginInstancesTotal, this group was previously unbounded. The longest-idle non-visible/non-focused one is unloaded first when over the limit.
PluginInstancesUIMax=8
