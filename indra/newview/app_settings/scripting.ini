; S24 - auto-converted from settings.xml, category: scripting


[Boolean]
; Use case insensitivity when searching in LSL editor
LSLFindCaseInsensitivity=0
; Disable syntax highlighting in script editor for performance testing
ScriptEditorDisableSyntaxHighlight=0
; Scripting help window updates contents based on script editor contents under text cursor
ScriptHelpFollowsCursor=0
; Allow LSL calls (such as LLMapDestination) to spawn viewer UI
ScriptsCanShowUI=1

[S32]
; Default width of buttons in the Script dialog toast.
ScriptToastButtonWidth=127

[String]
; Text font size in LSL editor
LSLFontSizeName=Monospace

[U32]
; Limits amount of dialogs per script (0 - per object, 1 - per channel, 2 - per channel for attachments, 3 - per channel for HUDs, 4 -unconstrained for HUDs)
ScriptDialogLimitations=0
