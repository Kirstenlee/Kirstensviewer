; S24 - auto-converted from settings.xml, category: avatar


[Boolean]
; Enable avatar physics.
AvatarPhysics=1

[F32]
; Avatar axis 0 dead zone.
AvatarAxisDeadZone0=0.1
; Avatar axis 1 dead zone.
AvatarAxisDeadZone1=0.1
; Avatar axis 2 dead zone.
AvatarAxisDeadZone2=0.1
; Avatar axis 3 dead zone.
AvatarAxisDeadZone3=0.1
; Avatar axis 4 dead zone.
AvatarAxisDeadZone4=0.1
; Avatar axis 5 dead zone.
AvatarAxisDeadZone5=0.1
; Avatar axis 0 scaler.
AvatarAxisScale0=1.0
; Avatar axis 1 scaler.
AvatarAxisScale1=1.0
; Avatar axis 2 scaler.
AvatarAxisScale2=1.0
; Avatar axis 3 scaler.
AvatarAxisScale3=1.0
; Avatar axis 4 scaler.
AvatarAxisScale4=1.0
; Avatar axis 5 scaler.
AvatarAxisScale5=1.0
; Avatar feathering (less is softer)
AvatarFeathering=16.0
; Angle between avatar facing and camera facing at which avatar turns to face same direction as camera, when moving fast (degrees)
AvatarRotateThresholdFast=2
; Angle between avatar facing and camera facing at which avatar turns to face same direction as camera, when moving slowly (degrees)
AvatarRotateThresholdSlow=60

[S32]
; how many avatars do we want to handle in total per batch (default is 5)
AvatarExtentRefreshMaxPerBatch=5
; how many frames do we spread over by default when refreshing extents (default is 4)
AvatarExtentRefreshPeriodBatch=4
; Select Avatar Name Tag Mode
AvatarNameTagMode=1

[String]
; Avatar Welcome Pack contents
AvatarWelcomePack=https://lecs-viewer-web-components.s3.amazonaws.com/v3.0/[GRID_LOWERCASE]/vawp/index.html

[U32:NoPersist]
AvatarSex=0

[U32]
; Specifes the maximum time in seconds to wait before sending your baked textures for avatar appearance.  Set to 0 to disable and wait until all baked textures are at highest resolution.
AvatarBakedTextureUploadTimeout=60
