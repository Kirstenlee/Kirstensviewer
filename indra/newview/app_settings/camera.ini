; S24 - auto-converted from settings.xml, category: camera


[Boolean:NoPersist]
; Enables the Joystick to control the flycam.
JoystickFlycamEnabled=1
MouseMoon=0
MouseSun=0

[Boolean]
; Tapping a direction key twice and holding it down makes avatar run
AllowTapTapHoldRun=1
; When entering appearance editing mode, camera zooms in on currently selected portion of avatar
AppearanceCameraMovement=1
; While cursor is in chat entry box, arrow keys still control your avatar
ArrowKeysAlwaysMove=0
; Keep camera position locked when avatar walks to selected position
AutoPilotLocksCamera=0
; Fly by holding jump key or using "Fly" command (FALSE = fly by using "Fly" command only)
AutomaticFly=1
; Enable framing overlay guides for machinima composition
CameraFramingEnabled=0
; Render with camera offset from view frustum (rendering debug)
CameraOffset=0
; Loop camera path playback
CameraRecorderLoop=0
; Use smooth interpolation between keyframes (ease in/out) - disable for linear playback
CameraRecorderSmoothInterpolation=0
; (obsolete)Click in world to walk to location
ClickToWalk=1
; (Obsolete)Enable double-click auto pilot
DoubleClickAutoPilot=0
; Enable double-click to teleport where allowed (afects minimap and people panel)
DoubleClickTeleport=0
; When entering build mode, camera moves up above avatar
EditCameraMovement=0
; Use Alt+mouse to look at and zoom in on objects
EnableAltZoom=1
; Allow first person perspective and mouse control of camera
EnableMouselook=1
; Treat Flycam values as absolute positions (not deltas).
FlycamAbsolute=0
; When in mouselook, moving mouse up looks down and vice verse (FALSE = moving up looks up)
InvertMouse=0
; Enables the Joystick to control Avatar movement.
JoystickAvatarEnabled=1
; Enables the Joystick to move edited objects.
JoystickBuildEnabled=0
; Enables Joystick Input.
JoystickEnabled=0
; Pass joystick yaw to scripts in Mouselook.
JoystickMouselookYaw=1
; Exit Mouselook mode via S or Down Arrow keys while sitting
LeaveMouselook=0
; Smooths out motion of mouse when in mouselook mode.
MouseSmooth=0
; Reset camera position to location at logout
RestoreCameraPosOnLogin=0
; Enable smooth acceleration/deceleration for flight controls - reduces overshoot (S24 Feature)
SmoothFlightMovement=1
; Enable smooth acceleration/deceleration for keyboard movement (S24 Feature)
SmoothKeyboardMovement=0
; Map Joystick zoom axis directly to camera zoom.
ZoomDirect=0

[Color4]
; Color of framing overlay guides (RGB)
CameraFramingColor=1.0,1.0,1.0,0.5

[F32]
; Camera field of view angle (Radians)
CameraAngle=1.047197551
; Camera aspect ratio for DoF effect
CameraAspectRatio=1.5
; Amount to scale down depth of field resolution.  Valid range is 0.25 (quarter res) to 1.0 (full res)
CameraDoFResScale=0.7
; Camera f-number value for DoF effect
CameraFNumber=9.0
; Vertical camera field of view for DoF effect (in degrees)
CameraFieldOfView=60.0
; Camera focal length for DoF effect (in millimeters)
CameraFocalLength=50
; How many seconds it takes the camera to transition between focal distances
CameraFocusTransitionTime=0.5
; Opacity of framing overlay guides (0.0-1.0)
CameraFramingOpacity=0.5
; Scale factor for framing guides - allows zoom in/out of composition area (0.5-2.0)
CameraFramingScale=1.0
; Maximum camera circle of confusion for DoF effect
CameraMaxCoF=10.0
; Scales the default offset
CameraOffsetScale=1.0
; Opacity of the Camera Controls floater
CameraOpacity=1.0
; Smooths camera position over time
CameraPositionSmoothing=4.0
; Time between camera keyframe captures in seconds (0.0166 = 60fps for buttery smooth playback)
CameraRecorderInterval=0.0166
; Maximum recording duration in seconds
CameraRecorderMaxDuration=60.0
; Playback speed multiplier (0.5 = half speed, 2.0 = double speed)
CameraRecorderPlaybackSpeed=1.0
; Mousewheel driven fraction of zoom
CameraZoomFraction=0.9
; Amount camera lags behind avatar motion (0 = none, 30 = avatar velocity)
DynamicCameraStrength=2.0
; Flycam axis 0 dead zone.
FlycamAxisDeadZone0=0.1
; Flycam axis 1 dead zone.
FlycamAxisDeadZone1=0.1
; Flycam axis 2 dead zone.
FlycamAxisDeadZone2=0.1
; Flycam axis 3 dead zone.
FlycamAxisDeadZone3=0.1
; Flycam axis 4 dead zone.
FlycamAxisDeadZone4=0.1
; Flycam axis 5 dead zone.
FlycamAxisDeadZone5=0.1
; Flycam axis 6 dead zone.
FlycamAxisDeadZone6=0.1
; Flycam axis 0 scaler.
FlycamAxisScale0=1.0
; Flycam axis 1 scaler.
FlycamAxisScale1=1.0
; Flycam axis 2 scaler.
FlycamAxisScale2=1.0
; Flycam axis 3 scaler.
FlycamAxisScale3=1.0
; Flycam axis 4 scaler.
FlycamAxisScale4=1.0
; Flycam axis 5 scaler.
FlycamAxisScale5=1.0
; Flycam axis 6 scaler.
FlycamAxisScale6=1.0
; Scale factor to apply to flycam movements when in build mode.
FlycamBuildModeScale=1.0
; Flycam feathering (less is softer)
FlycamFeathering=16.0
; Input threshold to initiate running
JoystickRunThreshold=0.25
; Controls responsiveness of mouse when in mouselook mode (fraction or multiple of default mouse sensitivity)
MouseSensitivity=3.0
; Vertical range over which avatar head tracks mouse position (degrees of head rotation from top of window to bottom)
PitchFromMousePosition=90.0
; Time in seconds for flight controls to accelerate to full speed (S24 Feature)
SmoothFlightAccelTime=0.35
; Time in seconds for flight controls to decelerate to stop (S24 Feature)
SmoothFlightDecelTime=0.40
; Smoothed value threshold (0.0-1.0) to trigger fast movement flags during flight (S24 Feature)
SmoothFlightFastThreshold=0.70
; Minimum smoothed value (0.0-1.0) before flight movement starts - creates dead zone for damping (S24 Feature)
SmoothFlightMinThreshold=0.15
; Time in seconds for keyboard movement to accelerate to full speed (S24 Feature)
SmoothMovementAccelTime=0.2
; Time in seconds for keyboard movement to decelerate to stop (S24 Feature)
SmoothMovementDecelTime=0.15
; Horizontal range over which avatar head tracks mouse position (degrees of head rotation from left of window to right)
YawFromMousePosition=90.0
; Time of transition between different camera modes (seconds)
ZoomTime=0.40000000596

[S32]
; Type of framing guide: 0=Rule of Thirds, 1=Golden Ratio, 2=Center Cross, 3=Safe Zones, 4=Diagonal, 5=Triangle
CameraFramingType=0
; Camera zooms in and out with mousewheel
CameraMouseWheelZoom=5
; Flycam hardware axis mapping for internal axis 0 ([0, 5]).
JoystickAxis0=1
; Flycam hardware axis mapping for internal axis 1 ([0, 5]).
JoystickAxis1=0
; Flycam hardware axis mapping for internal axis 2 ([0, 5]).
JoystickAxis2=2
; Flycam hardware axis mapping for internal axis 3 ([0, 5]).
JoystickAxis3=4
; Flycam hardware axis mapping for internal axis 4 ([0, 5]).
JoystickAxis4=3
; Flycam hardware axis mapping for internal axis 5 ([0, 5]).
JoystickAxis5=5
; Flycam hardware axis mapping for internal axis 6 ([0, 5]).
JoystickAxis6=-1
; Controls warping of the mouse to the center of the screen during alt-zoom and mouse look. Useful with certain input devices, mouse sharing programs like Synergy, or running under Parallels. 0 - automatic, 1 - on, 2 - off
MouseWarpMode=1

[String]
; Whether or not a joystick has been detected and initiailized.
JoystickInitialized=
; Name of currently selected preference
PresetCameraActive=Rear View

[U32]
; (Deprecated) Preset camera position - view (0 - rear, 1 - front, 2 - group)
CameraPreset=0
; Preset camera position - view (0 - rear, 1 - front, 2 - group, 3 - custom)
CameraPresetType=0

[Vector3]
; Default camera position relative to focus point when entering build mode
CameraOffsetBuild=-6.0,0.0,6.0
