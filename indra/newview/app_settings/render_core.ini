[F32:NoPersist]
; Render Time Limit in microseconds (0.0 = no limit)
RenderAvatarMaxART=4.699
; Luminance adjustment for diffuse surfaces to aid auto-exposure behavior
RenderDiffuseLuminanceScale=0.5
; Luminance coefficient for dynamic exposure
RenderDynamicExposureCoefficient=0.5
