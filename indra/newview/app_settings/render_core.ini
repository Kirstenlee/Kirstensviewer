; Sunlight scale fudge factor for matching with pre-PBR viewer when HDR is disabled
RenderSkySunlightScale=1.0

[F32]
; Alpha faces at or above this alpha write depth, so what is behind them is hidden. 1.01 = off.
RenderAlphaDepthWriteThreshold=0.98
; Batches nearer than this (metres) are sorted per face. Farther batches are sorted as one entry, which is cheaper.
RenderAlphaFaceSortDistance=24
; Direction change (unit-vector length) to any alpha group before its transparent draw order is re-sorted. Lower = more accurate sorting, more rebuild work. Was 0.64.
RenderAlphaResortThreshold=0.05
; Alpha sort depth: fraction of each face's full extent projected onto the view axis and pulled toward the camera. 0.5 = nearest point of the face box. 0 = face centre only.
RenderAlphaSortExtentFactor=0.5
; Maximum surface area of a set of proximal objects inworld before automatically hiding geometry to prevent system overload.
RenderAutoHideSurfaceAreaLimit=10.0E6
; Maximum surface area of attachments before an avatar is
; rendered as a simple impostor (to not use this limit, set to zero
; or set RenderAvatarMaxComplexity to zero).
RenderAutoMuteSurfaceAreaLimit=1000.0
; Controls level of detail of avatars (multiplier for current screen area when calculated level of detail)
RenderAvatarLODFactor=0.5
; Controls level of detail of avatar physics (such as breast physics).
RenderAvatarPhysicsLODFactor=1.0
; Maximum distance at which to render bumpmapped primitives (distance in meters, squared)
RenderBumpmapMinDistanceSquared=100.0
; Reference CPU clockspeed to use to bias GPU class (in MHz).
RenderCPUBasis=3000.0
; Memory bandwidth at which to default to Class 1 in gigabytes per second.  Used as basis for higher classes.
RenderClass1MemoryBandwidth=48.0
; S24 - Cirrus deck cell-size ratio, relative to the active WindLight preset's own cloud scale. Lower=finer/wispier cells.
RenderCloudCirrusScale=0.55
; S24 - Cirrus deck wind-scroll speed, relative to the base cloud layer's own scroll rate.
RenderCloudCirrusScrollMult=1.6
; S24 - Cumulus deck cell-size ratio, relative to the active WindLight preset's own cloud scale. Higher=bigger/puffier cells.
RenderCloudCumulusScale=1.7
; S24 - Cumulus deck wind-scroll speed, relative to the base cloud layer's own scroll rate.
RenderCloudCumulusScrollMult=0.6
; S24 - "Cloud base" height stratification strength (0=flat, same apparent height as the base layer; 1=cirrus reads notably higher/cumulus notably lower). A visual skew trick, not true altitude - the WindLight dome recenters on the camera every frame.
RenderCloudLayerHeightSkew=0.3
; S24 - Opacity multiplier for the extra cirrus/cumulus cloud decks. 0.0=invisible, 1.0=normal, 2.0=very pronounced.
RenderCloudLayerOpacity=1.0
; S24 DX_RENDER only: minimum time budget in milliseconds per frame for creating GPU textures on the main thread (DX_RENDER has no worker-thread texture creation - see LLImageGL::initClass()). Overrides RenderTextureUpdateBudgetMS's share for this phase when larger.
RenderDXCreateTextureBudgetMS=16.0
; Test Alpha Masking Cutoffs.
RenderDebugAlphaMask=0.5
; Scale of normals in debug display.
RenderDebugNormalScale=0.1
; Scalar for softening alpha surfaces (for soft particles).
RenderDeferredAlphaSoften=0.75
; Gamma ramp exponent for final correction before display gamma.
RenderDeferredDisplayGamma=2.2
; Noise scalar to hide banding in deferred render.
RenderDeferredNoise=4.0
; Amount local lights are washed out by sun.
RenderDeferredSunWash=0.5
; Cutoff for depth difference that amounts to an edge.
RenderEdgeDepthCutoff=0.01
; Cutoff for normal difference that amounts to an edge.
RenderEdgeNormCutoff=0.25
; Exposure value to send to tonemapper.
RenderExposure=1.0
; Distance of far clip plane from camera (meters)
RenderFarClip=128.0
; Controls level of detail of flexible objects (multiplier for amount of time spent processing flex objects)
RenderFlexTimeFactor=1.0
; DEPRECATED - Distance from camera where fog reaches maximum density (fraction or multiple of far clip distance)
RenderFogRatio=4.0
; DEPRECATED - Sets gamma exponent for renderer
RenderGamma=0.0
; Max glow alpha value for brightness extraction to auto-glow.
RenderGlowMaxExtractAlpha=0.25
; Min luminance intensity necessary to consider an object bright enough to automatically glow.
RenderGlowMinLuminance=9999
; Additive strength of glow.
RenderGlowStrength=0.325
; Amount of warmth extraction to use (versus luminance extraction). 0 = lum, 1.0 = warmth
RenderGlowWarmthAmount=0.0
; Glow sample size (higher = wider and softer but eventually more pixelated)
RenderGlowWidth=1.3
; S24 Advanced - Strength of the sun's volumetric light (KVTweaks: Rendering Advanced > Volumetric Light > Intensity). Real raymarched volumetric light, not a cheap screen-space streak - grown well past the original "godrays" effect this started as. 0=off.
RenderGodrayIntensity=0.15
; Exposure adjustment of HDRI when previewing an HDRI.  Units are EV.  Sane values would be -10 to 10.
RenderHDRIExposure=0.0
; Rotation (in degrees) of environment when previewing an HDRI.
RenderHDRIRotation=0.0
; What percentage of screen to render using HDRI vs EEP sky.
RenderHDRISplitScreen=1.0
; S24 task: base translucency of the jelly-doll ghost effect - 0 is fully invisible, 1 is fully opaque. 0.2 is roughly "80% transparent".
RenderJellyGhostBaseAlpha=0.07
; S24 task: strength of the jelly-doll ghost's silhouette edge glow. 0 disables it entirely (flat translucent silhouette only).
RenderJellyGhostRimIntensity=0.45
; S24 task: how far the jelly-doll ghost's edge glow reaches from the silhouette boundary - higher values give a thicker glow.
RenderJellyGhostRimWidth=1.2
; S24 DX_RENDER - extra world-space slack (meters) added to a local light's box radius ONLY for the CPU-side view-frustum visibility test (AABBInFrustumNoFarClip), not the light's actual drawn size. AABBInFrustumNoFarClip is a hard, zero-margin cutoff, so small lights right at the edge of the view cone pop in/out on the slightest camera pan. This is a blunt, brute-force mitigation (not a smooth fade/hysteresis system). A small (3m) default never makes culling more aggressive, only ever neutral or helpful - but 3m is negligible next to lights that are tens of degrees off-axis, which is most of the reported "popping" cases. At 32m (a sane default for a default midnight scene, alongside RenderLocalLightHoldTime/RenderLocalLightMinRadius) this setting mostly stops being "frustum edge forgiveness" and starts meaning "nearby local lights are gated by distance/light-count budget (RenderFarClip/RenderLocalLightCount, both independent of this) rather than view direction," which is a deliberate tradeoff, not an oversight. 0 = original hard-cutoff behavior.
RenderLocalLightFrustumMargin=32.0
; S24 DX_RENDER - minimum real-time (seconds) a local light holds its last visibility state before it's allowed to flip, once it has passed RenderLocalLightFrustumCulling's per-frame test at least once. Whole-light counterpart to the per-pixel N.L smoothing already applied in multiPointLightF.hlsl: a hard, zero-margin binary visibility test recomputed fresh every frame from camera-relative geometry pops visibly under continuous camera micro-motion at high frame rates. Only does real work when RenderLocalLightFrustumCulling is enabled (off by default in this fork) - a deliberate pairing for lower-end systems: cull aggressively for real performance headroom, hold briefly to pay for it with no visible flicker cost. 0 = instant, original hard-cutoff behavior. Replaces the previous RenderLocalLightSmartCulling/PriorityInnerRadius/PriorityMidRadius settings, which were UI-only and never read by any render code. 0.30 is a sane default for a default midnight scene.
RenderLocalLightHoldTime=0.30
; S24 DX_RENDER - extends how far a local light's glow reaches to at least this many meters via a soft tail, without changing its true brightness up close. Small decorative local lights (walkway lanterns etc.) are commonly built with a tiny real radius (1-3m), meaning the camera has to be almost standing inside one before it contributes any light at all. A light's TRUE radius still gates whether it's considered "on" at all (radius=0 stays off), and still fully determines its real near-field falloff - this setting only adds a soft reach-extension glow (strength controlled by RenderLocalLightReachGlow) between the light's true radius and this floor. 0 = original behavior, no extended reach.
RenderLocalLightMinRadius=64.0
; S24 DX_RENDER - peak strength of RenderLocalLightMinRadius's reach-extension glow, as a fraction of a light's own center brightness. 0 makes the extended reach invisible (same look as RenderLocalLightMinRadius=0). Deliberately modest by default (0.35) so the extension reads as a gentle ambient glow, not a second full-strength light.
RenderLocalLightReachGlow=0.05
; Maximum OpenGL version to attempt use (minimum 3.1 maximum 4.6).  Requires restart. Windows only.
RenderMaxOpenGLVersion=4.6
; Time interval over which to fade avatar names (seconds)
RenderNameFadeDuration=1.0
; Fade avatar names after specified time (seconds)
RenderNameShowTime=10.0
; S24 - Nebula patch brightness/saturation multiplier. 0.0=invisible, 1.0=normal, 2.0=vivid.
RenderNebulaIntensity=1.0
; Scaler applied to height map when generating normal maps
RenderNormalMapScale=64.0
; Projector specular exponent cap (lower = wider highlight). Used when RenderProjectorSpecularReliable is on.
RenderProjectorSpecularExponent=24
; Projector specular mip cap (lower = sharper colour at distance). Used when RenderProjectorSpecularReliable is on.
RenderProjectorSpecularLODCap=1
; Fraction of draw distance defining the switch to a different shader LOD
RenderShaderLODThreshold=1.0
; Fraction of draw distance to not use shader on particles
RenderShaderParticleThreshold=0.25
; S24 - Average shooting stars per minute. 0=effectively off, 4=occasional, 20=meteor shower.
RenderShootingStarFrequency=4.0
; Ambient scale fudge factor for matching with pre-PBR viewer
RenderSkyAmbientScale=1.0
; Amount to scale ambient when auto-adjusting legacy skies
RenderSkyAutoAdjustAmbientScale=1.0
; Blue Horizon Scale value to use when auto-adjusting legacy skies
RenderSkyAutoAdjustBlueDensityScale=1.0
; Blue Horizon Scale value to use when auto-adjusting legacy skies
RenderSkyAutoAdjustBlueHorizonScale=1.0
; HDR Scale value to use when auto-adjusting legacy skies
RenderSkyAutoAdjustHDRScale=1.0
; Sun color scalar when auto-adjusting legacy skies
RenderSkyAutoAdjustSunColorScale=1.0
; Snapshot resolutions above this multiple of the window size render at the capped size and get GPU-upscaled instead of natively (avoids GPU driver timeouts on large jumps).
RenderSnapshotNativeSizeLimit=1.0
; Specular exponent for generating spec map
RenderSpecularExponent=368.0
; S24 - Fraction of the baked star field to show (0.0=nearly empty sky, 1.0=full field). Pure shader-side visibility cull, no geometry cost.
RenderStarDensity=1.0
; S24 - Strength of the Milky-Way-style galactic dust band. 0.0=off, 1.0=normal, 2.0=very pronounced.
RenderStarDustIntensity=1.0
; S24 - Star field glow. 0.0-1.0 scales point brightness (normal at 1.0). Above 1.0 no longer brightens the point itself - instead fades in a soft colored haze halo that widens as you push it further, up to 3.0.
RenderStarGlow=1.0
; Defines what percent brighter the sun is than local point lights (1.0 = 100% brighter. Value should not be less than 0. ).
RenderSunDynamicRange=1.0
; Controls level of detail of terrain (multiplier for current screen area when calculated level of detail)
RenderTerrainLODFactor=1.0
; PBR terrain detail texture scale (meters)
RenderTerrainPBRScale=8.0
; Higher values create sharper transitions, but are more likely to produce artifacts.
RenderTerrainPBRTriplanarBlendFactor=8.0
; Terrain detail texture scale (meters)
RenderTerrainScale=12.0
; Time budget in milliseconds per frame for texture updates to maintain smooth frame pacing
RenderTextureUpdateBudgetMS=2.0
; Mix between linear and tonemapped colors (0.0(Linear) - 1.0(Tonemapped)
RenderTonemapMix=0.7
; Controls level of detail of vegetation (multiplier for current screen area when calculated level of detail)
RenderTreeLODFactor=0.5
; S24 - Contrast multiplier for every UI element covered by the hue-shift mechanism (floaters, panels, buttons, icons, sliders, scrollbars, progress bars, inventory icons). 1.0=neutral, <1.0=flatter/lower contrast, >1.0=punchier/higher contrast. Independent of the per-category hue sliders - works even when they're all 0.
RenderUIContrast=1.0
; S24 - Hue rotation (degrees) applied to button, slider, scrollbar and color-swatch colors. 0=no shift, uses the skin's own authored colors.
RenderUIHueShiftControls=0.0
; S24 - Hue rotation (degrees) applied to floater/window chrome and panel background colors. 0=no shift, uses the skin's own authored colors.
RenderUIHueShiftFloaters=0.0
; S24 - Hue rotation (degrees) applied to inventory, filter and outfit-gallery colors. 0=no shift, uses the skin's own authored colors.
RenderUIHueShiftInventory=0.0
; S24 - Hue rotation (degrees) applied to minimap, beacon, pathfinding and selection-silhouette colors. 0=no shift, uses the skin's own authored colors.
RenderUIHueShiftMap=0.0
; S24 - Hue rotation (degrees) applied to menu bar, pie menu, toolbar and chiclet colors. 0=no shift, uses the skin's own authored colors.
RenderUIHueShiftMenus=0.0
; S24 - Hue rotation (degrees) applied to every other UI color not covered by the other hue-shift categories (login screen, base palette, avatar-list icons, materials, etc). 0=no shift, uses the skin's own authored colors.
RenderUIHueShiftMisc=0.0
; S24 - Hue rotation (degrees) applied to the script editor's background and syntax-highlighting colors. 0=no shift, uses the skin's own authored colors.
RenderUIHueShiftScript=0.0
; S24 - Hue rotation (degrees) applied to text, chat, nametag, notification and tooltip colors. 0=no shift, uses the skin's own authored colors.
RenderUIHueShiftText=0.0
; S24 - Strength of a fixed diagonal glass-sheen highlight overlaid on every UI element covered by the hue-shift mechanism. 0=off, 1.0=strongest. Independent of the per-category hue sliders - works even when they're all 0.
RenderUIShine=0.0
; How often (in seconds) the deterministic VRAM budget allocator (LLViewerTextureList::runVRAMBudgetAllocation()) recomputes which textures need a lower discard level to stay under budget. Also triggered immediately on teleport arrival and backgrounded/minimized transitions.
RenderVRAMAllocationIntervalSeconds=0.5
; S24 (eviction tuning): fraction of the VRAM allocator's hard budget used as the "soft" target. Once a cut is genuinely needed (usage exceeds the hard budget), the allocator cuts down to this softer line instead of the hard line, leaving real headroom so the next burst of texture demand doesn't immediately re-trigger another cut. 0.75-0.80 keeps usage clear of the shared-GPU-memory cliff (committed GPU memory exceeding dedicated VRAM causes WDDM to back the overflow with system RAM over PCIe - catastrophic, not just a quality drop); 0.90 does not leave enough margin.
RenderVRAMSoftPressureFraction=0.8
; Controls level of detail of primitives (multiplier for current screen area when calculated level of detail)
RenderVolumeLODFactor=4.125

[S32:NoPersist]
; OBSOLETE and UNUSED. See RenderAvatarMaxNonImpostors
RenderAvatarMaxVisible=0
; Outputs a selected buffer to the screen.  -1 = final render buffer.  0 = Albedo, 1 = Specular/ORM, 2 = Normal, 3 = Emissive, 4 = Eye luminance, 5 = FXAA Luminance/SMAA Edge Tex, 6 = SMAA Blend Weights, 7 = SMAA Blend Weights vertical (.ba)
RenderBufferVisualization=-1

[S32]
; Maximum projector lights added to alpha-pool surfaces per frame (nearest first). Each one adds a draw pass.
RenderAlphaProjectorCount=2
; Alpha draw order: 0 = batch order (previous behaviour), 1 = per-face nearest-point sort within each batch.
RenderAlphaSortMode=1
; Anisotropic filtering level (1-16) for textures using anisotropic filtering
RenderAnisotropicLevel=8
; 0 - complexity limit applies to everyone, 1 - always show friends, 2 - only show friends
RenderAvatarComplexityMode=0
; Unused obsolete setting
RenderComplexityStaticMax=-1
; Unused obsolete setting
RenderComplexityThreshold=-1
; Number of times to iterate the glow (higher = wider and smoother but slower)
RenderGlowIterations=2
; Glow map resolution power of two.
RenderGlowResolutionPow=9
; Shader-side hardware cost tier, 0 (weakest) to 5 (strongest), mirrors EGPUClass. -1 means Auto: follow the detected GPU class live. Once set to a concrete number it is never changed automatically by anything except the Preferences "Reset to recommended settings" button.
RenderHardwareShaderTier=-1
; Number of local lights to render.
RenderLocalLightCount=256
; Maximum size of a single node's vertex data (in KB).
RenderMaxNodeSize=65536
; Maximum number of particles to display on screen
RenderMaxPartCount=4096
; Maximum size of a vertex buffer (in KB).
RenderMaxVBOSize=4096
; S24 task: main process CPU Quality-of-Service tier applied at window creation (llwindowwin32.cpp). 0=Eco (Windows EcoQoS power throttling enabled, background-friendly), 1=Normal (default OS scheduling, throttling disabled), 2=High (throttling disabled, main thread priority boosted to HIGHEST, process priority class raised to ABOVE_NORMAL).
RenderProcessQoS=1
; Count of texture indices to reserve for shadow and reflection maps when using indexed texture rendering.  Probably only want to set from the login screen.
RenderReservedTextureIndices=14
; Max lighting level to use in the shader (class 3 is default, 2 is less lights, 1 is sun/moon only.  Works around shader compiler bugs on certain platforms.)
RenderShaderLightingMaxLevel=3
; S24 - Night sky style: 0=Default, 1=Real Constellations (stylized approximations of well-known constellation shapes, not precise astronomical data), 2=Starry Night (Van Gogh-inspired blue/gold swirl). Requires restart - star placement is baked once at startup.
RenderSkyStyle=0
; Detail applied to terrain texturing (0 = none, 1 = full)
RenderTerrainDetail=1
; Detail level for PBR terrain. 0 is full detail. Negative values drop rendering features, in accordance with the GLTF specification when possible, which reduces the number of texture binds.
RenderTerrainPBRDetail=0
; How many UV planes to sample PBR terrain textures from. 1 is "flat", 3 is triplanar mapping (aka box mapping)
RenderTerrainPBRPlanarSampleCount=3

[String]
; S24 - CPU Sets: manually override which logical processor indices count as "preferred" for RenderReserveCoresForMainThread, instead of auto-detection. Comma/range syntax, e.g. "16-31" or "16,17,18,24". Needed on dual-CCD AMD X3D chips (7950X3D/9950X3D) where auto-detection cannot reliably confirm which CCD actually has the 3D V-Cache - check Task Manager's per-core CPU view or a tool like HWiNFO to find the right core range, then set it here. Leave empty for auto-detection.
RenderPreferredCoresOverride=

[U32:NoPersist]
; OBSOLETE. This setting has been renamed RenderAvatarMaxNonImpostors.
RenderAutoMuteRenderWeightLimit=0

[U32]
; Maximum Avatar Complexity; above this value, the avatar is
; rendered as a solid color outline (0 to disable this limit).
RenderAvatarMaxComplexity=0
; Maximum number of avatars to fully render at one time;
; over this limit uses impostor rendering (simplified rendering
; with less frequent updates), reducing client lag.
RenderAvatarMaxNonImpostors=12
; Quality of antialiasing: 0 = Low, 1 = Medium, 2 = High, 3 = Ultra
RenderFSAASamples=2
; Type of Antialiasing to use: 0 = None, 1 = FXAA, 2 = SMAA
RenderFSAAType=2
; Viewer will warn user about HUD containing to many objects if objects count is above this value
RenderHUDObjectsWarning=1000
; How many textures with size 1024 * 1024 or bigger HUD can contain before notifying user
RenderHUDOversizedTexturesWarning=6
; Viewer will warn user about HUD textures using memory above this value (in bytes)
RenderHUDTexturesMemoryWarning=32000000
; Viewer will warn user about HUD containing to many textures if texture count is above this value
RenderHUDTexturesWarning=200
; Maximum texture index to use for indexed texture rendering.
RenderMaxTextureIndex=16
; Maximum texture resolution to download for non-boosted textures.
RenderMaxTextureResolution=2048
; Maximum amount of texture memory to budget for (in MB), or 0 for autodetect.
RenderMaxVRAMBudget=0
; Minimum free main (system) memory in MB before the texture pipeline starts discarding cached textures more aggressively.
RenderMinFreeMainMemoryThreshold=512
; Triangle count threshold at which automatic LOD generation stops
RenderMinimumLODTriangleCount=16
; Maximum number of frames to wait on an occlusion query before forcibly reading it back
RenderOcclusionTimeout=8
; Which graphics settings you've chosen. Don't use this setting to change quality directly from debug settings.
RenderQualityPerformance=1
; S24: self-complexity notices are suppressed entirely below this value. Stock LL has no absolute floor here - it re-nags on every outfit-driven complexity change no matter how low the number is. Set to zero to restore stock behaviour.
RenderSelfComplexityWarnThreshold=80000
; Force 32-bit floating point LUT
RenderSpecularPrecision=0
; Spec map resolution.
RenderSpecularResX=1024
; Spec map resolution.
RenderSpecularResY=256
; What tonemapper to use: 0 = Khronos Neutral, 1 = ACES, 2 = Hable (Uncharted 2), 3 = Uchimura, 4 = ACES (Fast), 5 = AgX
RenderTonemapType=0

[Vector3]
; Weights for each color channel to be used in calculating luminance (should add up to 1.0)
RenderGlowLumWeights=1.0,0.0,0.0
; Weight of each color channel used before finding the max warmth
RenderGlowWarmthWeights=1.0,0.5,0.7
