; S24 - auto-converted from settings.xml, category: render_core


[Boolean:NoPersist]
; When enabled hides all avatars that aren't friends. Does not affect inworld control avatars (animeshes), nor self.
RenderAvatarFriendsOnly=0
; Hardware has support for GLTF scene shaders
RenderCanUseGLTFPBROpaqueShaders=1
; Hardware has support for Terrain Bake shaders
RenderCanUseTerrainBakeShaders=1
; Disable tone mapping and exposure correction when build floater is open (for artists developing materials)
RenderDisablePostProcessing=0
; Show selection outlines on objects
RenderHighlightSelections=1
; EXPERIMENTAL: Enable PBR Terrain texture transforms.
RenderTerrainPBRTransformsEnabled=0
; Use exposure sky settings instead of deriving from HDR scale.
RenderUseExposureSkySettings=0

[Boolean]
; AMD AGS: let the driver compile shaders asynchronously on background threads, and enable its disk shader cache (AMD GPUs only, requires restart)
RenderAgsAsyncShaderCompile=1
; AMD AGS: allocate GPU hang/crash diagnostic breadcrumb markers (AMD GPUs only, requires restart) - troubleshooting only, leave off unless asked
RenderAgsBreadcrumbMarkers=0
; Projected lights also light transparent surfaces, fading with their alpha. Off = previous behaviour.
RenderAlphaProjectors=0
; Animate rezing prims.
RenderAnimateRes=0
; Whether we want to use multi-threaded OpenGL on Apple hardware (requires restart of SL).
RenderAppleUseMultGL=0
; Render lighted prims that are attached to avatars
RenderAttachedLights=1
; Render particle systems that are attached to avatars
RenderAttachedParticles=1
; Use alpha masks where appropriate in the Advanced Lighting Model
RenderAutoMaskAlphaDeferred=1
; Use alpha masks where appropriate when not using the Advanced Lighting Model
RenderAutoMaskAlphaNonDeferred=1
; Show extra information in viewer logs about avatar rendering costs
RenderAutoMuteLogging=0
; Controls if system avatar clothes use wavy cloth
RenderAvatarCloth=0
; Bake sunlight into vertex buffers for static objects.
RenderBakeSunlight=0
; Display L$ balance in snapshot
RenderBalanceInSnapshot=1
; S24 - Enable extra 2.5D cloud decks (a fast thin high-cirrus layer + a slow big cumulus layer) on top of the normal EEP cloud layer, for a sense of depth without full volumetric raymarching.
RenderCloudLayers=1
; S24: real-time BC7 GPU texture compression (OpenCL-based) - uploads textures uncompressed, then upgrades them to BC7 in the background to cut VRAM usage (~4:1 vs uncompressed) with minimal frame-time impact. EXPERIMENTAL, no restart required (applies to newly-loaded/re-decoded textures).
RenderCompressTextures=0
; S24 - draw thin dotted lines connecting each constellation's stars (Real Constellations style only) - educational "star chart" look. Live-toggle, no restart needed.
RenderConstellationLines=0
; Probe cube convention: flip X of the generator quad (live orientation control, default off).
RenderCubeConvFlipX=0
; Probe cube convention: flip Y of the generator quad. Default on: confirmed live for sphere probe reflections.
RenderCubeConvFlipY=1
; Probe cube convention: swap X and Y of the generator quad (live orientation control, default off).
RenderCubeConvSwapXY=0
; Whether we can render the cube map or not
RenderCubeMap=1
; S24 (DX_RENDER): enable the DX11 shader bytecode disk cache - content-hash-keyed, covering every DX_RENDER shader with no allowlist (DXShader::isCacheEligible()). Uses the shader_cache folder and the KVTweaks "Purge Shader Cache" button clears it too.
RenderDXShaderCacheEnabled=1
; Enable texture bind performance test.
RenderDebugTextureBind=0
; DEPRECATED (only true supported) - Use deferred rendering pipeline (Advanced Lighting Model).
RenderDeferred=1
; Execute atmospheric shader in deferred renderer.
RenderDeferredAtmospheric=1
; Execute sunlight shader in deferred renderer.
RenderDeferredSun=1
; Throttle creation of drawables.
RenderDelayCreation=0
; Delay vertex buffer updates until just before rendering
RenderDelayVBUpdate=0
; Use the GPU's depth bounds test to skip pixels outside each local light's depth range (AMD AGS / NVAPI, real perf win on both vendors) - troubleshooting toggle if local lights look wrong
RenderDepthBoundsTest=1
; Whether to use depth of field effect when Advanced Lighting Model is enabled
RenderDepthOfField=0
; Whether to use depth of field effect when in edit mode
RenderDepthOfFieldInEditMode=0
; EXPERIMENTAL: Prime the depth buffer with simple prim geometry before rendering with textures.
RenderDepthPrePass=0
; Desaturate irradiance to remove blue tint
RenderDesaturateIrradiance=1
; Enables additional rendering pipeline features on newer machines such as HDR and emissive textures on PBR content.
RenderDisableVintageMode=1
; Dynamically adjust level of detail.
RenderDynamicLOD=1
; Enable emissive buffer in gbuffer.  Should only be disabled in GL3 mode.
RenderEnableEmissiveBuffer=1
; Proactively evict textures orphaned by a region-change teleport instead of waiting on the lazy round-robin cleanup. Off by default -- testing linked it to avatar rendering flakiness and lower framerate in heavy scenes.
RenderFlushOrphanedTexturesOnTeleport=0
; Don't use a compatibility profile OpenGL context.  Requires restart.
RenderGLContextCoreProfile=0
; Use fully controllable gamma correction, instead of faster, hard-coded gamma correction of 2.
RenderGammaFull=1.0
; Render bloom post effect.
RenderGlow=1
; Enable HDR for glow map
RenderGlowHDR=0
; Enables glow noise (dithering). Reduces banding from glow in certain cases.
RenderGlowNoise=1
; Enable HDR rendering.
RenderHDREnabled=1
; Only use HDRI sky for irradiance map when RenderHDRISplitScreen is 0
RenderHDRIIrradianceOnly=0
; Display HUD attachments in snapshot
RenderHUDInSnapshot=0
; Display particle systems in HUD attachments (experimental)
RenderHUDParticles=0
; Enable support for HiDPI displays, like Retina (macOS ONLY, requires restart)
RenderHiDPI=0
; Show selection lines on objects that are behind other objects
RenderHiddenSelections=0
; Don't show my group title in my name label
RenderHideGroupTitle=0
; Error occured while initializing GL
RenderInitError=0
; Render the radius of selected lights
RenderLightRadius=0
; S24 HardLight Mode - excludes off-screen local lights from competing for rendering priority. In non-deferred mode this reserves the (genuinely limited, 6) hardware light units for on-screen lights; in deferred mode there is no such hard count limit (see RenderLocalLightCount instead), so this frustum cut is HardLight Mode's whole real effect. Lights near your own avatar are always exempt from the cut regardless of camera framing, so a cammed-out "beauty shot" doesn't extinguish your own surroundings. OFF = Traditional LL behavior where selected lights can bypass distance sorting and off-screen lights compete equally.
RenderLocalLightFrustumCulling=0
; S24: When blocking an agent, also derender objects they own in the region (max 500 per agent)
RenderMuteOwnedObjects=0
; Display own name above avatar
RenderNameShowSelf=1
; S24 - Enable soft colored nebula patches in the night sky.
RenderNebulaEnabled=1
; Disable rendering of alpha objects (render all alpha objects as alpha masks).
RenderNoAlpha=0
; 
; Disable features which prevent nVidia nSight from being usable with SL. Requires restart.
; 
RenderNsightDebugSupport=0
; DEPRECATED (only TRUE supported) Show bumpmapping on primitives
RenderObjectBump=1
; S24 (DX_RENDER): dispatch ordinary (non-self, non-control) avatars' updateCharacter() calls across the DXPool worker threads instead of the main thread, Task #283 Phase 2. Off by default - experimental.
RenderParallelAvatarCharacter=0
; Display selected parcel outline
RenderParcelSelection=1
; 
; Disable rendering of everything but in-world content for
; performance testing
; 
RenderPerformanceTest=0
; Use GL_STREAM_DRAW in place of GL_DYNAMIC_DRAW
RenderPreferStreamDraw=0
; PBR surfaces, projector lights only: take the highlight from the legacy Blinn-Phong lobe (gloss = 1 - roughness) instead of GGX. Off = GGX.
RenderProjectorPBRLegacySpecular=0
; Projector lights only: widen the specular highlight and keep its colour with distance. Off = LL behaviour.
RenderProjectorSpecularReliable=0
; Purge shader cache on exit to force shader rebuild on next launch (S24 Tweaks)
RenderPurgeShaderCacheOnExit=0
; S24 - CPU Sets: reserve the detected (or RenderPreferredCoresOverride'd) preferred cores for the main/render and window threads, pushing all other threads in this process off them. Structural, not priority-based - does not elevate process/thread priority. Requires Windows 10+; silently no-ops otherwise.
RenderReserveCoresForMainThread=1
; S24 - Enable occasional shooting stars/meteors streaking across the sky.
RenderShootingStars=1
; If true, automatically adjust legacy skies (those without a probe ambiance value) to take advantage of probes and HDR.  This is the "opt-out" button for HDR and tonemapping when coupled with a sky setting that predates PBR.
RenderSkyAutoAdjustLegacy=0
; Disable tone mapping and exposure correction when snapshot is being rendered
RenderSnapshotNoPost=0
; Whether to support projectors as spotlights when Advanced Lighting Model is disabled
RenderSpotLightsInNondeferred=0
; Enable PBR Terrain features.
RenderTerrainPBREnabled=0
; EXPERIMENTAL: Change normal gen for PBR Terrain.
RenderTerrainPBRNormalsEnabled=0
; S24 - legacy skies (Linden/stock sky and water, or any sky predating the reflection_probe_ambiance field) force tonemap mix and exposure off via LLSettingsSky::canAutoAdjust(), with no way for the user to edit around it (Linden's own sky is a no-modify library asset). When on, LLEnvironment::update() gives the current legacy sky a tiny (0.01) reflection_probe_ambiance value every frame - just large enough to flip canAutoAdjust() off and unlock tonemap/exposure/water/sharpen-shader selection uniformly, same mechanism a real HDR-capable sky already uses, without the much larger visual ambient-lighting change RenderSkyAutoAdjustLegacy's own DEFAULT_AUTO_ADJUST_PROBE_AMBIANCE (1.0) would cause. Not persisted or saved to the asset. Off by default to preserve normal legacy Linden sky/water behaviour.
RenderTonemapEverywhere=0
; Display tracking arrow and beacon to target avatar, teleport destination
RenderTrackerBeacon=1
; Cache ui render in a screen aligned buffer.
RenderUIBuffer=0
; S24 - Desaturates every UI element covered by the hue-shift mechanism to grayscale (luminance-weighted). Independent of the per-category hue sliders - works even when they're all 0.
RenderUIGrayscale=0
; Display user interface in snapshot
RenderUIInSnapshot=0
; Show avatars which haven't finished loading
RenderUnloadedAvatar=0
; Use fancy precomputed atmospherics and stuff.
RenderUseAdvancedAtmospherics=0
; Route Direct3D 11/DXGI through DXVK's Vulkan translation layer instead of the native driver, via the dxvkproxy d3d11.dll/dxgi.dll shipped in the install root. Compatibility workaround, not a performance feature. Off by default; takes effect on next restart.
RenderUseDXVK=0
; If false, frustum culling will ignore far clip plane.
RenderUseFarClip=1
; Use VBO's for stream buffers
RenderUseStreamVBO=1
; DEPRECATED - now always assumed to be false - Use triangle strips for rendering prims.
RenderUseTriStrips=0
; [EXPERIMENTAL] Use GL Vertex Array Objects.
RenderUseVAO=0
; Use GL Vertex Buffer Objects
RenderVBOEnable=1
; Disable VBO glMapBufferARB
RenderVBOMappingDisable=1
; Update frames between display scans (FALSE = Update frames as fast as possible).
RenderVSyncEnable=1

