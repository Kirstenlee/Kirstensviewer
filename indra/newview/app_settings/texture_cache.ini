; S24 - auto-converted from settings.xml, category: texture_cache


[Boolean]
; Bulk upload scales textures to 2K if true, to 1K if false
BulkUpload2KTextures=1
; Use advanced Jpeg2000 compression options (precincts, blocks, ordering, markers)
Jpeg2000AdvancedCompression=0
; Check for old version of disk cache to migrate to current location
MigrateCacheDirectory=1
; Clear local file cache next time viewer is run
PurgeCacheOnNextStartup=0
; Clear local file cache every time viewer is run
PurgeCacheOnStartup=0
; Whether or not to LRU purge the disk cache during startup on main thread
PurgeDiskCacheOnStartup=0
; S24 TEXTURE CACHE RAM: Use experimental RAM cache buffer for ultra-low latency texture access. WARNING: Data may be lost on crash! Requires viewer restart.
TextureCacheUseRAMBuffer=0
; If TRUE, do not fetch and decode any textures
TextureDecodeDisabled=0
; If TRUE, do not load textures for in-world content
TextureDisable=0
; Preview selections in texture picker or material picker immediately
TextureLivePreview=1
; If TRUE, always load textures at full resolution (discard = 0)
TextureLoadFullRes=0
; Use the new more accurate byte range computation for j2c discard levels
TextureNewByteRange=1

[F32:NoPersist]
; Amount to boost resolution of textures that are important to the camera.
TextureCameraBoost=8.0

[F32]
; The percent of total cache size (defined by CacheSize) to use for the disk cache (ex: asset storage, excludes textures)
DiskCachePercentOfTotal=35.0
; Simulate HTTP fetch failures for some server bake textures.
TextureFetchFakeFailureRate=0.0
; If texture fetching time exceeds this value, texture fetch tester will log info
TextureFetchMinTimeToLog=2.0
; Multiplier for texture memory allocation (0.5-4.0)
TextureMemMultiplier=1.0
; Limits how texture scale affects area calculation.
TextureScaleMaxAreaFactor=25.0
; Limits how texture scale affects area calculation.
TextureScaleMinAreaFactor=0.0095

[S32]
; Version number of disk cache
DiskCacheVersion=0
; Size of encoding blocks. Assumed square and same for all levels. Must be power of 2. Max 64, Min 4.
Jpeg2000BlocksSize=64
; Size of image precincts. Assumed square and same for all levels. Must be power of 2.
Jpeg2000PrecinctsSize=256
; Version number of cache
LocalCacheVersion=0
; Number of texture fetch batches to process per frame
TextureFetchNumBatches=8
; Minimum number of textures to update per frame (S24: Increased from 32 to 512 to prevent priority starvation in texture-heavy regions)
TextureFetchUpdateMinCount=512
; Minimal percent of the optimal byte range allowed to render a given discard level
TextureReverseByteRange=50
; Maximum texture width for user uploaded textures
max_texture_dimension_X=1024
; Maximum texture height for user uploaded textures
max_texture_dimension_Y=1024

[String:NoPersist]
; Current location for bulk saving textures to disk
TextureSaveLocation=

[String]
; Controls the location of the local disk cache
CacheLocation=
; Controls the top folder location of the the local disk cache
CacheLocationTopFolder=
; The name of the disk cache (within the standard Viewer disk cache directory)
DiskCacheDirName=cache
; Change the location of the local disk cache to this
NewCacheLocation=
; Change the top folder location of the local disk cache to this
NewCacheLocationTopFolder=

[U32]
; Controls amount of hard drive space reserved for local file caching in MB
CacheSize=6144
; Used to distribute cache validation
CacheValidateCounter=0
; Terrain texture dimensions (power of 2)
RegionTextureSize=256
; Specify texture resolution (0 = highest, 5 = lowest)
TextureDiscardLevel=0
; Maximum number of HTTP connections used for texture fetches (0=auto-scale based on CPU, range 1-64, default 16)
TextureFetchConcurrency=0
; Specifies the byte threshold at which texture download data should be sent to the sim.
TextureLoggingThreshold=1

[Vector4]
; Per-channel texture streaming aggressiveness. X=normals, Y=diffuse, Z=specular/metallic, W=emissive. 1.0=baseline, higher=more aggressive downrez.
TextureChannelPriority=5,7.5,20,7.5
