; S24 - auto-converted from settings.xml, category: render_reflections


[Boolean:NoPersist]
; Render influence volumes of Reflection Probes
RenderReflectionProbeVolumes=0

[Boolean]
; Execute screen space ambient occlusion shader in deferred renderer.
RenderDeferredSSAO=1
; Renders realtime mirrors.
RenderMirrors=0
; Automatic reflection probes use their own radius for parallax. Off samples by direction only, which reads as infinitely far away.
RenderReflectionAutoParallax=1
; Enable box-volume reflection probes (manual probes whose object is a box). Disable to stop their capture and rendering; sphere probes are unaffected.
RenderReflectionBoxProbesEnabled=1
; Captures reflection cells on a fixed 16 m grid around the camera for shiny surfaces. Experimental.
RenderReflectionCellGrid=0
; Excludes avatars and particles from the master reflection cube under Static and dynamic. A performance choice.
RenderReflectionExcludeAvatarDynamic=0
; Excludes avatars and particles from the master reflection cube under Realtime. A performance choice.
RenderReflectionExcludeAvatarRealtime=1
; Captures one realtime master cube centred on the avatar every frame, used as every glossy/shiny/mirror surface's reflection source. A single avatar-centred capture refreshed fast enough under Dynamic/Realtime detail to stay locally relevant as you move; not room-fitted, so very close reflections can look scaled/zoomed.
RenderReflectionMasterCube=1
; Show reflection probes in the transparency debug view
RenderReflectionProbeShowTransparent=1
; Enable reflection probes on shiny surfaces. Disable to remove all probe reflections.
RenderReflectionProbesEnabled=1
; Performance: while the master reflection cube is on and complete, it and the default probe are the only ones actually sampled (see RenderReflectionMasterCube) - this stops the scheduler from still spending a full capture on local automatic probes nothing will sample in that state. Off restores pre-S24.1.2 behavior.
RenderReflectionSkipUnsampledProbes=1
; Enable/disable reflection probes
RenderReflectionsEnabled=1
; Run the separate screen-space reflection pass before deferred lighting. Off uses the inline trace in the lighting shader, which keeps mirrors working (default off until the pass is fixed).
RenderSSRPassEnabled=0
; Temporal accumulation for the screen-space reflection pass. Blends last frame's result into the current trace to remove speckle. Only applies with the SSR pass enabled.
RenderSSRTemporal=1
; Renders screen space reflections to better account for dynamic objects with reflection probes.
RenderScreenSpaceReflections=1

[F32:NoPersist]
; Maximum effective probe ambiance for local lights
RenderReflectionProbeMaxLocalLightAmbiance=4.0
; Max factor for irradiance input to SSAO
RenderSSAOIrradianceMax=0.18
; Scaling factor for irradiance input to SSAO
RenderSSAOIrradianceScale=0.6

[F32]
; Fraction of the way the default/sky probe moves toward each new capture per update cycle - 1.0 snaps instantly, lower smooths out the pop as sky/clouds change (S24 Runtime Tweak)
RenderDefaultProbeFadeWeight=0.35
; When RenderReflectionProbeLevel is 0, amount of time in seconds to wait between updates to reflection map.
RenderDefaultProbeUpdatePeriod=2.0
; Distance in meters for hero probes to render out to.
RenderHeroProbeDistance=8
; S24 DX_RENDER - minimum real-time (seconds) an already-complete sphere/box reflection probe (every probe except the default one, which has its own RenderDefaultProbeUpdatePeriod) must wait before it's eligible to be picked for its next refresh. A full refresh is spread across ~12 frames (irradiance commits roughly halfway through, radiance at the end), and mComplete stays true the whole time, so an already-complete probe re-selected purely by staleness re-enters that torn window immediately and indefinitely with no throttle. This doesn't make a refresh atomic - it reduces how often an already-stable probe re-enters the torn window at all. 0 = original no-throttle behavior.
RenderProbeMinRecaptureInterval=2.0
; Material reflection gate: gloss (roughness inverted) at or above this gets full reflection, ramped from Reject below it. 0 disables the gate. Default 0.65, equal to Reject's default - a hard cutoff approximating original LL hardcoded behavior; separate the two for a smooth ramp instead (S24 Runtime Tweak).
RenderReflectionGateGlossAccept=0.65
; Material reflection gate: gloss (roughness inverted) at or below this gets no reflection. 0 disables the gate. Default 0.65 approximates original LL hardcoded glossy-reflection behavior; tune from there (S24 Runtime Tweak).
RenderReflectionGateGlossReject=0.65
; Material reflection gate: metallic at or above this gets full reflection, ramped from Reject below it. PBR materials only. 0 disables the gate. Default 0.65, equal to Reject's default - a hard cutoff approximating original LL hardcoded behavior; separate the two for a smooth ramp instead (S24 Runtime Tweak).
RenderReflectionGateMetallicAccept=0.65
; Material reflection gate: metallic at or below this gets no reflection. PBR materials only. 0 disables the gate. Default 0.65 approximates original LL hardcoded metallic-reflection behavior; tune from there (S24 Runtime Tweak).
RenderReflectionGateMetallicReject=0.65
; Parallax-correction radius (metres) of the master reflection cube's capture sphere. Smaller values better match a tight indoor space and reduce close-up zoom/scale mismatch; larger values suit open/expansive regions. Default 20m is a comfortable general-purpose indoor value found by live testing; live-tunable, no restart needed.
RenderReflectionMasterCubeRadius=20
; Ambient probe contribution multiplier (S24 Runtime Tweak). Local lights are additive on top of ambient, so a lower ambient floor lets local light contribution actually read visually instead of being washed out. 1.0 (full, unscaled ambient) is the default; lower it if local lights are being washed out.
RenderReflectionProbeAmbientMultiplier=1.0
; Direction-space blur/smudge radius for probe reflections, 0=sharp (no cost beyond one branch) - the 16-tap kernel only holds up to about 0.06-0.08 before sample gaps show as separated ghosts again, so the useful range is small on purpose (S24 Runtime Tweak). Off by default - even a small non-zero value pays the full 16-tap cost on every probe sample for a barely-visible smudge; opt in deliberately.
RenderReflectionProbeBlurSpread=0.0
; Reflection probe contrast adjustment (S24 Runtime Tweak)
RenderReflectionProbeContrast=1.0
; Camera far clip to use when updating reflection probes.
RenderReflectionProbeDrawDistance=64
; Blend this probe's reflection toward its own fully-averaged top mip (S24 Runtime Tweak). 0=no change (full detail), 1=fully equalized (this room's own averaged tone, blended across all 6 captured faces) - a different tool from Saturation (crushes hue) and Contrast (compresses spread toward a fixed midpoint): pulls per-face brightness/color differences toward this probe's own real average instead of an arbitrary neutral.
RenderReflectionProbeEqualize=0.0
; Overall reflection probe intensity multiplier (S24 Runtime Tweak)
RenderReflectionProbeIntensity=1.0
; Reflection probe visibility blend, 0%-100% (S24 Runtime Tweak). 100%=fully visible (no change), 0%=fully transparent (reflection probe contributes nothing, revealing the surface's other lighting on its own). Separate from Intensity (a 0-2 multiplier that can also boost past normal) - a clean, one-way visibility-only knob.
RenderReflectionProbeOpacity=1.0
; Reflection probe color saturation (S24 Runtime Tweak)
RenderReflectionProbeSaturation=1.0
; Occlusion sensitivity factor for ambient occlusion (larger is more)
RenderSSAOFactor=0.30
; Scaling factor for the area to sample for occluders (pixels at 1 meter away, inversely varying with distance)
RenderSSAOScale=500.0
; Scale on the probe reflection where screen-space reflection misses (0 = none, 1 = full probe). Hits always replace it.
RenderSSRMissFill=0.25
; Multiplier to scale adaptive stepping.
RenderScreenSpaceReflectionAdaptiveStepMultiplier=1.6
; Bias against the depth buffer before rejecting a sample.
RenderScreenSpaceReflectionDepthRejectBias=0.001
; Distance bias to apply when rejecting a potential sample.
RenderScreenSpaceReflectionDistanceBias=0.015
; Minimum glossiness (1-roughness) a surface needs before Screen-Space Reflections engage. Defaults to 0 (no artificial gate) - SSR's own internal vignette falloff already fades it to zero below ~0.57, so that natural falloff is the only real limiter; a separate hard cutoff on top of it was blocking materials (e.g. PBR alpha-blend/glass, which caps at 0.7 due to a separate roughness floor) that should otherwise be able to use SSR.
RenderScreenSpaceReflectionGlossThreshold=0.0
; How big the step is between each run.
RenderScreenSpaceReflectionRayStep=0.1
; Probe ambiance value when auto-adjusting legacy skies
RenderSkyAutoAdjustProbeAmbiance=0.01
; Water's own gloss reflection gate, independent of the Materials-tab one. 0 disables the gate (the canonical original LL default - water has never been gloss-gated upstream). Separate from Reject for a smooth ramp instead of a hard cutoff (S24 Runtime Tweak).
RenderWaterReflectionGateGlossAccept=0.0
; Water's own gloss reflection gate, independent of the Materials-tab one. 0 disables the gate (the canonical original LL default - water has never been gloss-gated upstream). Water's gloss tracks the active water preset's Blur Multiplier, not a fixed near-1.0 constant like most surfaces, so a gate tuned for everything else can legitimately clip it (S24 Runtime Tweak).
RenderWaterReflectionGateGlossReject=0.0
; S24 - Intensity multiplier for water reflections. Reduces or boosts reflection visibility. Lower = less mirror-like water.
RenderWaterReflectionIntensity=1.0
; S24 Advanced - Reflection color temperature/warmth. <1.0=cool/cold, 1.0=neutral, >1.0=warm/golden. Artistic color grading for reflections.
RenderWaterReflectionWarmth=1.0
; Step size for water SSR ray marching. Larger values = longer reflection distance but lower accuracy.
RenderWaterSSRRayStep=0.15

[S32]
; Resolution to render hero probes used for mirrors, water, etc.
RenderHeroProbeResolution=1024
; How many frames to wait for until it's time to render the probe. E.g., every other frame (1), every two frames (2), every three frames (3) etc.
RenderHeroProbeUpdateRate=2
; Detail of reflections. (-1 - Disabled, 0 - Static Only, 1 - Static + Dynamic, 2 - Realtime)
RenderReflectionProbeDetail=0
; Reflection probes control.  0 - disable (one probe to rule them all), 1 - manual probes only, 2 - manual + terrain/water, 3 - Manual + Terrain/water + objects.  Default 2 (manual + terrain/water) is a fair middle ground for new users.
RenderReflectionProbeLevel=2
; Maximum number of samples to apply for glossy SSR.
RenderScreenSpaceReflectionGlossySamples=4
; Number of times the ray march algorithm runs to find a potential hit.
RenderScreenSpaceReflectionIterations=25
; Number of ray march iterations for water Screen Space Reflections. Higher values = better quality, lower performance.
RenderWaterSSRIterations=15

[U32]
; Number of probes to render.  Maximum of 256.  Clamps to the nearest power of 2.  Default 128 is a fair middle ground for new users (VRAM cost scales with this x resolution).
RenderReflectionProbeCount=128
; Resolution of reflection probe cube faces. Applied at runtime. Rounded to the next highest power of two, clamped to [64, 512]. Higher values use considerably more video memory.
RenderReflectionProbeResolution=256
; Maximum screen radius for sampling (pixels)
RenderSSAOMaxScale=200

[Vector3]
; Multiplier for (1) value and (2) saturation (HSV definition), for areas which are totally occluded.  Blends with original color for partly-occluded areas.  (Third component is unused.)
RenderSSAOEffect=0.80,1.00,0.00
