; S24 - auto-converted from settings_per_account.xml, group: PerAccount

[Boolean:NoPersist]
; Pause the viewer side Animation Overrider
PauseAO=0
; Use the viewer side Animation Overrider for standing and turning animations when enabled
UseAOStands=1

[Boolean]
; Expand either messages or conversations list pane from Conversations compact mode.
ConversationsExpandMessagePaneFirst=1
; Stores the expanded/collapsed state of the conversations list pane in Conversations floater.
ConversationsListPaneCollapsed=0
; Stores the expanded/collapsed state of Conversations floater message pane.
ConversationsMessagePaneCollapsed=0
; Stores the expanded/collapsed state of Nearby chat participant list
ConversationsParticipantListCollapsed=1
; Does user's do not disturb mode message differ from default?
DoNotDisturbResponseChanged=0
; Fetch recent messages from group chat servers when a group window opens
FetchGroupChatHistory=1
; Stores the open/closed state of inventory Received Items panel.
InventoryInboxToggleState=0
; Obsolete - this setting is no longer used and has no effect.
LogChat=0
; Obsolete - this setting is no longer used and has no effect.
LogChatIM=0
; Obsolete - this setting is no longer used and has no effect.
LogChatTimestamp=0
; Add Date Stamp to chat and IM Logs with format chat-YYYY-MM-DD and 'IM file name'-YYYY-MM. To view old logs goto ..\Second Life\[login name]
LogFileNamewithDate=0
; Log Nearby Chat messages to a file. Is used instead of LogChat but with the "1" default value.
LogNearbyChat=1
; Log Show History
LogShowHistory=1
; Log Timestamp
LogTimestamp=1
; Include Date with Timestamp
LogTimestampDate=1
; Saving expanded/collapsed state of the nearby chat between sessions
NearbyChatIsNotCollapsed=0
; saving torn-off state of the nearby chat between sessions
NearbyChatIsNotTornOff=1
; Use Previous Screenshot for Abuse report
PreviousScreenshotForReport=0
; S24 - decline ad-hoc/conference chat and call invites from non-friends that are NOT a real
; session of a group you're actually a member of (checked via gAgent.isInGroup()). Chat/calls
; from groups you've joined, and direct IMs/calls from individuals, are never affected - this
; narrowly targets the bot/griefing pattern of adding a target to an unsolicited ad-hoc
; conference, without needing the much blunter VoiceCallsFriendsOnly (which also blocks every
; legitimate non-friend IM).
RejectUnsolicitedGroupChat=0
; Determines whether favorites of last logged in user will be saved on exit from viewer and shown on login screen
ShowFavoritesOnLogin=1
; Translation prefs are set
TranslatingEnabled=0
; Use the viewer side Animation Overrider
UseAO=0
; Use the full Animation Overrider interface (TRUE) or the small, reduced interface (FALSE).
UseFullAOInterface=1
; Only accept voice calls and receive IMs from residents on your friends list
VoiceCallsFriendsOnly=0

[F32]
; After-everything-else fixup for avatar Z position.
AvatarHoverOffsetZ=0.0
; The ratio between the width of Navigation layout panel and the width of whole Navigation layout stack
NavigationBarRatio=0.6

[Rect]
; Position and size for the full Animation Overrider interface. The defaults are just dummy values.
floater_rect_animation_overrider_full=0,0,0,0

[S32]
; Conversations floater list pane width.
ConversationsListPaneWidth=205
; Conversations floater message pane width.
ConversationsMessagePaneWidth=412
; Inventory inbox panel height in Inventory floater.
InventoryInboxHeight=200
; Keep a conversation log and transcripts 2 - both, 1 - logs, 0 - none
KeepConversationLogTranscripts=2

[String]
; All animation uploads will be stored in this directory (UUID)
AnimationUploadFolder=
; Auto response to instant messages while in do not disturb mode.
DoNotDisturbModeResponse=This resident has turned on 'Do Not Disturb' and will see your message later.
; Path to your log files.
InstantMessageLogPath=
; Last recipient of postcard
LastPostcardRecipient=
; All model uploads will be stored in this directory (UUID)
ModelUploadFolder=
; All pbr uploads will be stored in this directory (UUID)
PBRUploadFolder=
; Path to last snapshot save location
SnapshotBaseDir=
; Pattern for naming snapshots
SnapshotBaseName=Snapshot
; All sound uploads will be stored in this directory (UUID)
SoundUploadFolder=
; All image(texture) uploads will be stored in this directory (UUID)
TextureUploadFolder=
; Selected Voice Morph
VoiceEffectDefault=00000000-0000-0000-0000-000000000000

[U32]
; Setting for the user's preferred Max Content rating for Experiences search (Default rating is General)
ExperienceSearchMaturity=2
; The last time the received items inbox was poked by the user.
LastInventoryInboxActivity=0
; Last logoff
LastLogoff=0
