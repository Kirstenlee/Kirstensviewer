; S24 - auto-converted from settings.xml, category: stats_perf


[Boolean:NoPersist]
; Request performance analysis for a particular viewer run
AnalyzePerformance=0
; Log performance analysis for a particular viewer run
LogPerformance=0
; In viewer stats data file, skip saving entry if there is no data
StatsReportSkipZeroDataSaves=0

[Boolean]
; Allow the viewer to adjust your settings to achieve target FPS
AutoTuneFPS=0
; Enable/disable using MaxNonImpostor to limit avatar rendering by distance.
AutoTuneImpostorByDistEnabled=0
; When enabled the viewer will dynamically change settings until auto tune is explicitly turned off.
AutoTuneLock=0
; Expand Advanced performance stats display
OpenDebugStatAdvanced=0
; Expand Basic performance stats display
OpenDebugStatBasic=1
; Expand Memory Usage stats display
OpenDebugStatMemory=1
; Expand Network performance stats display
OpenDebugStatNet=1
; Expand Pathfinding performance stats display
OpenDebugStatPathfinding=0
; Expand Physics Details performance stats display
OpenDebugStatPhysicsDetails=0
; Expand Render performance stats display
OpenDebugStatRender=1
; Expand Simulator performance stats display
OpenDebugStatSim=1
; Expand Simulator Time performance stats display
OpenDebugStatSimTime=0
; Expand Simulator Time Details performance stats display
OpenDebugStatSimTimeDetails=0
; Expand Texture performance stats display
OpenDebugStatTexture=0
; Expand Voice (WebRTC) stats display
OpenDebugStatVoice=1
; Expand Incoming audio (Voice) stats display
OpenDebugStatVoiceIncoming=1
; Expand Outgoing audio (Voice) stats display
OpenDebugStatVoiceOutgoing=1
; Enable/disable render time data to support autotune.
PerfStatsCaptureEnabled=1
; Develop > Render Tests debug toggle - sleeps 500ms every 10th frame to simulate periodic hitching
Periodic Slow Frame=0
; Enable Testing Features.
QAMode=0
; Simulates system folder issues in inventory
QAModeFakeSystemFolderIssues=0
; Enables QA features (logging, faster cycling) for metrics collector
QAModeMetrics=0
; if true, disables running the GPU benchmark at startup
; (default to class 1)
SkipBenchmark=0
; Performance testing mode, no network
SpeedTest=0
; Play back autopilot
StatsAutoRun=0
; Quit application after this number of autopilot playback runs
StatsQuitAfterRuns=0
; Track rendering and network statistics
StatsSessionTrackFrameStats=0

[F32:NoPersist]
; Avatars beyond this range will automatically be optimized
AutoTuneImpostorFarAwayDistance=64.0
; The lowest draw distance that auto tune is allowed to use
AutoTuneRenderFarClipMin=32.0
; The draw distance that auto tune will try to achieve
AutoTuneRenderFarClipTarget=256.0

[F32]
; Max time per frame devoted to mainloop work queue (in milliseconds)
MainWorkTime=1.0
; Timeout duration for mainloop lock detection during teleports, login and logout, in seconds.
MainloopTimeoutDefault=120.0
; Timeout duration for mainloop lock detection when logged in and not teleporting, in seconds.
MainloopTimeoutStarted=30.0
; OBSOLETE UNUSED setting.
MaxFPS=-1.0
; The percentage that the frametime difference must exceed in order to register a frametime event. 0.1 = 10%, 0.25 = 25%, etc.
StatsFrametimeEventThreshold=0.1
; Interval to save viewer stats file data
StatsReportFileInterval=0.2
; Maximum seconds for viewer stats file data, prevents huge file
StatsReportMaxDuration=300

[S32:NoPersist]
; (Deprecated) Port on which lleventhost should listen
QAModeEventHostPort=-1
; On LL_ERRS, terminate with this code instead of OS message box
QAModeTermCode=-1

[S32]
; Amount of time to yield every frame to other applications when SL is not the foreground window (milliseconds)
BackgroundYieldTime=40
; The number of seconds to sample extended frametime data (percentiles, stddev).
StatsFrametimeSampleSeconds=5
; Loop autopilot playback this number of times
StatsNumRuns=-1
; Yield some time to the local host.
YieldTime=-1

[String]
; Filename for stats logging output
StatsFile=fs.txt
; Filename for stats logging autopilot path
StatsPilotFile=pilot.txt
; Filename for stats logging extended autopilot path
StatsPilotXMLFile=pilot.xml
; Filename for stats logging summary
StatsSummaryFile=fss.txt

[U32]
; For debugging -- number of cores to restrict the main process to, or 0 for no limit.  Requires restart.
EmulateCoreCount=0
; Desired minimum FPS
TargetFPS=15
