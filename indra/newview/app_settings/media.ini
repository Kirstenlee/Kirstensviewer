; S24 - auto-converted from settings.xml, category: media


[Boolean:NoPersist]
; This is a tentative flag that may be temporarily set off by the user, until she teleports
MediaTentativeAutoPlay=1

[Boolean]
; Automatically play HUD media
MediaAutoPlayHuds=1
; If true, enable targeted links and javascript in media to open new media browser windows without a prompt.
MediaEnablePopups=0
; Whether or not to show the "link sharing" UI
MediaOnAPrimUI=1
; Whether to show debug data for the media performance manager in the nearby media list.
MediaPerformanceManagerDebug=0
; Turn on debugging messages that may help diagnosing media issues (WARNING: May reduce performance).
MediaPluginDebugging=0
; Whether or not to show media on other avatars
MediaShowOnOthers=0
; Whether or not to show media from outside the current parcel
MediaShowOutsideParcel=1
; Whether or not to show media within the current parcel
MediaShowWithinParcel=1

[F32]
; Amount of time (in seconds) that the media control fades
MediaControlFadeTime=1.5
; Amount of time (in seconds) for media controls to fade with no mouse activity
MediaControlTimeout=3.0
; Distance at which media volume is set to 0
MediaRollOffMax=80.0
; Adjusts the distance at which media attentuation starts
MediaRollOffMin=40.0
; Multiplier to change rate of media attenuation
MediaRollOffRate=0.02

[S32]
; This setting controls which media (once loaded) does not require a first click to focus before interaction can begin. This allows clicks to be passed directly to media bypassing the focus click requirement. This setting is a bitfield, precomputed values are as follows: Disabled=0; Worn HUDs only=1; Owned objects=2; Friend objects=4; Group objects=8; Landowner objects=16; Any object=32767; All MOAP=32768. For complete details see lltoolpie.h enum MediaFirstClickTypes.
MediaFirstClickInteract=31
; Location of the virtual ear for media and sounds
MediaSoundsEarLocation=0
