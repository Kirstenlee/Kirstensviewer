; S24 - auto-converted from settings.xml, category: kv


[Boolean:NoPersist]
; Toonify the Render
UseCelShade=0
; Desaturation to Black and White
UseDesaturation=0
; Edge Glow Effect
UseEdgeGlow=0
; Green Night Vision
UseNightVision=0
; Enable or disable RGB control
UseRGBControl=0
; Fancy Border
UseVignette=0

[Boolean]
; Enable verbose KVRAM cache debug logging (evictions, queries, pressure)
KVRAMCacheDebugLogging=0
; Enable KVRAM Cache: Passive RAM buffer for GPU-evicted textures (reduces disk thrashing)
KVRAMCacheEnabled=0
; Initialize AMD AGS at startup for AMD GPU/driver detection (NVAPI equivalent)
UseAmdAgs=1
; Enable Motion Blur Effect
UseMotionBlur=0
; Enable NVIDIA Reflex low-latency mode (NVIDIA GPUs only)
UseNvidiaReflex=1

[F32:NoPersist]
; Strength of Vignette Effect
VignetteIntensity=0.8

[F32]
; Blue channel adjustment
BlueControlKV=1.0
; Global boost multiplier for RGB channels
BoostMultiplierKV=1.0
; Controls the contrast multiplier for RGB manipulation (1.0 = normal, >1.0 = higher contrast.
ContrastMultiplierKV=1.0
; Controls the gamma correction for RGB manipulation (1.0 = normal, >1.0 = brighter.
GammaCorrectionKV=1.0
; Green channel adjustment
GreenControlKV=1.0
; Controls the hue rotation for RGB manipulation (degrees, 0-360).
HueRotationKV=0.0
; Aggressive RAM-to-Disk eviction at this usage (0.0-1.0, emergency mode)
KVRAMCacheHardThreshold=0.90
; Minimum texture deck size (100-10000 textures in 100 steps, higher = more cache hits before rotation)
KVRAMCacheMinDeckSize=100.0
; Minimum retention time in seconds before a texture is eligible for eviction (0.1-30 seconds in 0.1 second steps)
KVRAMCacheRetentionTimeSec=10.0
; Begin gentle RAM-to-Disk eviction at this buffer usage level (0.0-1.0)
KVRAMCacheSoftThreshold=0.75
; Statistics floater update interval in seconds
KVRAMCacheStatsUpdateInterval=0.5
; Motion Blur Blend Factor (0.0 = full trail, 1.0 = no blur)
MotionBlurBlend=0.7
; Red channel adjustment
RedControlKV=1.0
; Controls the saturation adjustment for RGB manipulation (0.0 = grayscale, 1.0 = normal, >1.0 = oversaturated).
SaturationControlKV=1.0
; Strength of Vignette Effect
brightnessBoost=30.0
; Edge Glow Blur
edgeBlurRadius=2.0
; Edge Glow Intensity
edgeGlowIntensity=5.0
; Edge Glow Sensitivity
edgeSensitivity=1.5
; Strength of Vignette Effect
greenIntensity=1.5
; Night V Noise
noiseAmountNightV=0.5

[U32]
; Default value
CelshadeInterval=256
; RAM cache size for GPU-evicted textures (passive buffer, 256-4096 MB in 256 MB steps)
KVRAMCacheRAMBudgetMB=2048
; Clamped typical value
KVdefault_cores=6
; Clamped maximum value
KVmax_cores=16
; Clamped minimum value
KVmin_cores=2
; Default value
noiseScale=2
