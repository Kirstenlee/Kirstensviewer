; S24 - auto-converted from settings.xml, category: snapshot


[Boolean]
; Enable exposure bracketing in burst capture
SnapshotBracketEnable=0
; Show center crosshair guide on snapshot preview
SnapshotGuideCenter=0
; Show diagonal guides on snapshot preview
SnapshotGuideDiagonals=0
; Show golden-ratio guide on snapshot preview
SnapshotGuideGolden=0
; Show 1:1 safe-area frame on snapshot preview
SnapshotGuideSafe11=0
; Show 16:9 safe-area frame on snapshot preview
SnapshotGuideSafe169=0
; Show 4:3 safe-area frame on snapshot preview
SnapshotGuideSafe43=0
; Show rule-of-thirds guide on snapshot preview
SnapshotGuideThirds=0
; Show the right-side Snapshot pro inspector panel
SnapshotInspectorOpen=0

[Color4]
; Color of snapshot composition guides overlay
SnapshotGuideColor=1.0,1.0,1.0,1.0

[F32]
; EV step between bracketed exposures
SnapshotBracketEVStep=1.0
; Seconds between shots in a snapshot burst
SnapshotBurstIntervalSec=1.0
; Opacity of snapshot composition guides overlay (0.0 - 1.0)
SnapshotGuideOpacity=0.6

[S32]
; Number of snapshots to take in a burst
SnapshotBurstCount=3
; Save snapshots in this format (0 = PNG, 1 = JPEG, 2 = BMP)
SnapshotFormat=0
; Ease curve for A-to-B interpolation: 0 linear, 1 ease-in, 2 ease-out, 3 ease-in-out
SnapshotInterpEase=3
; Number of interpolation frames between camera A and B
SnapshotInterpSteps=24
; Quality setting of postcard JPEGs (0 = worst, 100 = best)
SnapshotQuality=75

[String]
; Filename template for snapshot sequences. Tokens: {date} {time} {seq:NN}
SnapshotFilenamePattern=Snapshot_{date}_{seq:04}

[U32]
; Snapshot composition guides overlay bitmask (1=thirds, 2=golden, 4=diagonals, 8=center, 16=safe16:9, 32=safe4:3, 64=safe1:1)
SnapshotGuideMask=0
