; S24 - auto-converted from settings.xml, category: selection_editing


[Boolean:NoPersist]
CreateToolCopyCenters=1
CreateToolCopyRotates=0
CreateToolCopySelection=0
; Select individual parts of linked objects
EditLinkedParts=0
; Select reflection probes
SelectReflectionProbes=0

[Boolean]
; After using create tool, keep the create tool active
CreateToolKeepSelected=0
; Select objects that have at least one vertex inside selection rectangle
RectangleSelectInclusive=1
; Show indicator of selected scale axis when scaling
ScaleShowAxes=0
; Stretch textures along with object when scaling
ScaleStretchTextures=1
; Scale selected objects evenly about center of selection
ScaleUniform=0
; Select invisible objects
SelectInvisibleObjects=1
; Select only objects you can move
SelectMovableOnly=0
; Select only objects you own
SelectOwnedOnly=0
; S24: Enable custom color override for selection beam instead of default HUD effect color. Applies to both GL line and particles. Part of selection beam enhancement.
SelectionBeamUseCustomColor=0

[Color4]
; S24: Custom RGB color for selection beam when SelectionBeamUseCustomColor is enabled. Default cyan for classic "lightsaber" look. Part of selection beam enhancement.
SelectionBeamColor=0.0,1.0,1.0,1.0

[F32]
; Multiplier for land modification brush force.
LandBrushForce=1.0
; Size of affected region when using teraform tool
LandBrushSize=2.0
; All rotations via rotation tool are constrained to multiples of this unit (degrees)
RotationStep=1.0
; S24: Scale multiplier for selection beam particles (0.5-3.0) - controls glow intensity around GL line core. Part of selection beam enhancement.
SelectionBeamParticleScale=1.5
; S24: width in screen pixels of the selection beam's line core, drawn as a real DX11 billboard quad since D3D11 has no glLineWidth() equivalent. Part of selection beam enhancement feature.
SelectionBeamWidth=1.0
; Opacity of selection highlight (0.0 = completely transparent, 1.0 = completely opaque)
SelectionHighlightAlpha=0.40000000596
; Alpha value below which pixels are displayed on selection highlight line (0.0 = show all pixels, 1.0 = show now pixels)
SelectionHighlightAlphaTest=0.1
; Thickness of selection highlight line (fraction of view distance)
SelectionHighlightThickness=0.00999999977648
; Rate at which texture animates along U direction in selection highlight line (fraction of texture per second)
SelectionHighlightUAnim=0.0
; Scale of texture display on selection highlight line (fraction of texture size)
SelectionHighlightUScale=0.1
; Rate at which texture animates along V direction in selection highlight line (fraction of texture per second)
SelectionHighlightVAnim=0.5
; Scale of texture display on selection highlight line (fraction of texture size)
SelectionHighlightVScale=1.0

[S32]
; Minimum amount of objects in linkset for showing confirmation dialog
MinObjectsForUnlinkConfirm=6
; Last selected land modification operation (0 = flatten, 1 = raise, 2 = lower, 3 = smooth, 4 = roughen, 5 = revert)
RadioLandBrushAction=0
; S24: Line style for selection beam rendering. 0=Solid, 1=Dotted, 2=Dashed, 3=Dash-Dot. Part of selection beam enhancement.
SelectionBeamLineStyle=0
; S24: Selection beam render style - 0=Particles Only (Classic), 1=Solid Line Only (Clean), 2=Hybrid Line+Glow (Lightsaber). Part of selection beam enhancement feature.
SelectionBeamStyle=2
