; S24 - auto-converted from settings.xml, category: scene_loading


[Boolean:NoPersist]
; Enabled scene loading monitor if set
SceneLoadingMonitorEnabled=0

[Boolean]
; If set, ask sim to send full region object cache. Needs to restart viewer.
RequestFullRegionCache=1

[F32]
; Minimum size of any octree node
OctreeMinimumNodeSize=0.01
; in pixels, all objects in view frustum whose screen area is greater than this threshold will be loaded
SceneLoadFrontPixelThreshold=100.0
; in meters, all objects (visible or invisible) within this radius will remain loaded in memory
SceneLoadMinRadius=32.0
; a fraction of draw distance beyond which all objects outside of view frustum will be unloaded, regardless of pixel threshold
SceneLoadRearMaxRadiusFraction=0.75
; in pixels, all objects out of view frustum whose screen area is greater than this threshold will remain loaded
SceneLoadRearPixelThreshold=400.0
; Amount of pixels changed required to consider the scene as still loading (square root of fraction of pixels on screen)
SceneLoadingMonitorPixelDiffThreshold=0.02
; Time between screen samples when monitor scene load (seconds)
SceneLoadingMonitorSampleTime=0.25

[S32]
; Multiplier on attachment size for determining octree node size
OctreeAttachmentSizeFactor=4
; Multiplier on static object size for determining octree node size
OctreeStaticObjectSizeFactor=3

[U32]
; Number of frames non-visible objects stay in memory before being removed, clamped [10,64]. 0 means unlimited (never evicted, bypasses memory-adaptive scaling).
NonvisibleObjectsInMemoryTime=64
; Maximum number of elements to store in a single octree node
OctreeMaxNodeCapacity=128
; in MB, when total memory usage above this threshold, minimum invisible objects are kept in memory
SceneLoadHighMemoryBound=4096
; in MB, when total memory usage above this threshold, start to reduce invisible objects kept in memory
SceneLoadLowMemoryBound=750

[Vector3]
; Multiplier on alpha object distance for determining octree node size.  First two parameters are currently unused.  Third parameter is distance at which to perform detailed alpha sorting.
OctreeAlphaDistanceFactor=0.1,0.0,64.0
; Multiplier on distance for determining octree node size
OctreeDistanceFactor=0.25,0.0,0.0
