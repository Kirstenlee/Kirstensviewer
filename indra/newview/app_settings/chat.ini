; S24 - auto-converted from settings.xml, category: chat


[Boolean]
; Auto-complete gestures in nearby chat
ChatAutocompleteGestures=1
; Chat console takes up full width of SL window
ChatFullWidth=1
; Provide notifications for when friend log on and off of SL
ChatOnlineNotification=1
; Enable accumulated direct-message history from Chat Service for this login.
ChatServiceEnabled=1

[F32]
; Opacity of chat bubble background (0.0 = completely transparent, 1.0 = completely opaque)
ChatBubbleOpacity=0.5

[S32]
; Size of chat text in chat console (0 = small, 1 = big)
ChatFontSize=1
; Max number of active members we'll show up for an unresponsive group
ChatLoadGroupMaxMembers=100
