; S24 - auto-converted from settings.xml, category: render_shadows


[Boolean]
; S24 DX_RENDER - real-time shadow casting for ordinary local point/omni lights (prims with "Light" checked, non-projector), which otherwise have zero occlusion at all and shine straight through walls. Separate opt-in on top of RenderShadowDetail>1 (the existing projector-shadow gate) rather than folded into it unconditionally, since this is a genuinely significant extra GPU cost (1 shadow-casting light slot, 6 cube-face depth captures per frame it's occupied) that shouldn't silently 6x anyone's existing spotlight-shadow cost just by upgrading.
RenderPointLightShadows=0
; S24 DX_RENDER - whether sun-shadow detail is computed for reflection/mirror probe cube-face captures and 360/equirect captures (anything rendered with gCubeSnapshot set). Off skips the real cascade fit and shadow render for these captures entirely (same cheap clear path already used when a cascade has no visible receivers), trading shadow detail inside reflections and 360 captures for the real per-face cost of generateSunShadow() during probe-heavy periods (e.g. many probes refreshing right after login). Does not affect the main view's own shadows.
RenderReflectionProbeCaptureShadows=1
; Enable dynamic cascade shadow throttling system. When enabled, distant shadow cascades update less frequently when camera is still, improving performance. Disable for traditional fixed-rate cascade updates.
RenderShadowThrottleEnabled=1

[F32]
; Bias value for spot shadows (prevent shadow acne).
RenderDeferredSpotShadowBias=-64.0
; Offset value for spot shadows (prevent shadow acne).
RenderDeferredSpotShadowOffset=0.8
; Bias value for tree shadows (prevent shadow acne).
RenderDeferredTreeShadowBias=1.0
; Offset value for tree shadows (prevent shadow acne).
RenderDeferredTreeShadowOffset=1.0
; S24 DX_RENDER - bias value for point-light shadows (prevent shadow acne). Tuned separately from RenderSpotShadowBias since the point-light capture frustum (90-degree cube face) differs from a spotlight's cone-derived frustum.
RenderPointShadowBias=-0.0002
; Bias value for shadows (prevent shadow acne).
RenderShadowBias=-0.002
; Error scale for shadow bias (based on altitude).
RenderShadowBiasError=-0.007
; Distance scaler for shadow blur.
RenderShadowBlurDistFactor=0
; Scale of shadow softening kernel.
RenderShadowBlurSize=0.6
; Cutoff error value to use ortho instead of perspective projection.
RenderShadowErrorCutoff=5.0
; Cutoff FOV to use ortho instead of perspective projection.
RenderShadowFOVCutoff=0.8
; Magnitude of noise on shadow samples.
RenderShadowNoise=-0.0001
; Offset value for shadows (prevent shadow acne).
RenderShadowOffset=0.01
; Error scale for shadow offset (based on altitude).
RenderShadowOffsetError=0.0
; Exponent applied to transition between ortho and perspective shadow projections based on viewing angle and light vector.
RenderShadowProjExponent=0.5
; Amount to scale distance to virtual origin of shadow perspective projection.
RenderShadowProjOffset=2.0
; Scale of shadow map resolution vs. screen resolution (only positivie values are allowed)
RenderShadowResolutionScale=3.0
; Cutoff slope value for points to affect perspective shadow generation
RenderShadowSlopeThreshold=0.0
; Bias value for shadows (prevent shadow acne).
RenderSpotShadowBias=-0.0002
; Offset value for shadows (prevent shadow acne).
RenderSpotShadowOffset=0.04

[S32]
; Detail of shadows.
RenderShadowDetail=2
; Amount of shadow map splits to render (0 - 3).
RenderShadowSplits=3

[U32]
; S24 DX_RENDER - per-face texel resolution of the point-light shadow cube (6 faces, 1 slot). Absolute, not screen-relative like RenderShadowResolutionScale - a screen-relative scale across 6 faces would blow up resolution/cost far faster than a single spotlight map.
RenderPointShadowResolution=512
; S24 DX_RENDER - minimum frames between point-light shadow recaptures (6 faces each). Point-light shadows are a better throttling candidate than spotlight shadows (RenderSpotShadowThrottle) - an omnidirectional contact shadow being a frame or two stale is far less noticeable than a tightly-aimed spotlight cone being stale. 1 = recapture every frame (no throttling).
RenderPointShadowThrottle=2
; Number of samples to take for each pass of shadow blur (value range 1-16).  Actual number of samples is value * 2 - 1.
RenderShadowBlurSamples=4
; Number of consecutive still frames before cascade shadow throttling re-engages after camera movement stops. Higher values reduce transition flicker on slow hardware.
RenderShadowThrottleSettleFrames=6

[Vector3]
; Gaussian coefficients for the two shadow/SSAO blurring passes (z component unused).
RenderShadowGaussian=3.0,2.0,0.0
; Near clip plane split distances for shadow map frusta (x=perspective, y=ortho, z=transition rate).
RenderShadowSplitExponent=4.0,3.0,1.5
