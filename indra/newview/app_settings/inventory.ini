; S24 - auto-converted from settings.xml, category: inventory


[Boolean:NoPersist]
; Override received items inventory inbox display
InventoryDisplayInbox=0
; Allows copying folder id from context menu
InventoryExposeFolderID=0

[Boolean]
; Automatically accept new notecards/textures/landmarks
AutoAcceptNewInventory=0
; Bulk permission changes affect animations
BulkChangeIncludeAnimations=1
; Bulk permission changes affect body parts
BulkChangeIncludeBodyParts=1
; Bulk permission changes affect clothing
BulkChangeIncludeClothing=1
; Bulk permission changes affect gestures
BulkChangeIncludeGestures=1
; Bulk permission changes affect materials
BulkChangeIncludeMaterials=1
; Bulk permission changes affect notecards
BulkChangeIncludeNotecards=1
; Bulk permission changes affect objects
BulkChangeIncludeObjects=1
; Bulk permission changes affect scripts
BulkChangeIncludeScripts=1
; Bulk permission changes affect environment settings
BulkChangeIncludeSettings=1
; Bulk permission changes affect sounds
BulkChangeIncludeSounds=1
; Bulk permission changes affect textures
BulkChangeIncludeTextures=1
; render favorite items using InventoryFavoriteText as color
InventoryFavoritesColorText=1
; Show star near folders that contain favorites
InventoryFavoritesUseHollowStar=1
; Show star near favorited items in inventory
InventoryFavoritesUseStar=1
; Enable ability to create links to folders and items via "Paste as link".
InventoryLinking=1
; Enable debug output associated with the Merchant Outbox.
InventoryOutboxLogging=0
; Enable making the Merchant Outbox and Inbox visible in the inventory for debug purposes.
InventoryOutboxMakeVisible=0
; Show/hide Favorites tab in the Inventory floater
InventoryShowFavoritesTab=1
; Show/hide Recent tab in the Inventory floater
InventoryShowRecentTab=1
; Show/hide Worn tab in the Inventory floater
InventoryShowWornTab=1
; Log in system chat whenever an inventory offer is declined
LogInventoryDecline=1
; Always autofill My Outfits from library when empty (else happens just once).
MyOutfitsAutofill=0
; (Deprecated) Do not request inventory library.
NoInventoryLibrary=0
; 0 - show only matches. 1 - show all items in outfit as long as outfit or item inside matches.
OutfitListFilterFullList=1

[F32]
; Seconds before automatically opening inventory when mouse is over inventory button when performing inventory drag and drop
InventoryAutoOpenDelay=1.0
; Rate at which we simulate late-completing copy/link requests in some operations
InventoryDebugSimulateLateOpRate=0.0
; Rate at which we simulate failures of copy/link requests in some operations
InventoryDebugSimulateOpFailureRate=0.0

[S32]
; Gallery sorting: 0 - sort outfits by name, 1 - images frst, 2 - favorites first
OutfitGallerySortOrder=0
; How outfit list in Avatar's floater is sorted. 0 - by name 1 - favorites to top
OutfitListSortOrder=0
; Timeout for outfit related operations.
OutfitOperationsTimeout=180

[U32:NoPersist]
; Maximum number of subfolders allowed in a listing in the merchant outbox.
InventoryOutboxMaxFolderCount=20
; Maximum number of nested levels of subfolders allowed in a listing in the merchant outbox.
InventoryOutboxMaxFolderDepth=4
; Maximum number of items allowed in a listing in the merchant outbox.
InventoryOutboxMaxItemCount=200
; Maximum number of items allowed in a stock folder.
InventoryOutboxMaxStockItemCount=200

[U32]
; Defines behavior when hitting return on an inventory item
InventoryAddAttachmentBehavior=0
; Specifies sort key for inventory items (+0 = name, +1 = date, +2 = folders always by name, +4 = system folders to top)
InventorySortOrder=7
; Maximum capacity of the Trash folder. User will be offered to clean it up when exceeded.
InventoryTrashMaxCapacity=5000
; Limits number of items in the folder that can be replaced/added to current outfit
WearFolderLimit=125
