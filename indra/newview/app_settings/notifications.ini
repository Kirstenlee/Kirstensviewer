; S24 - auto-converted from settings.xml, category: notifications


[Boolean:NoPersist]
; Return false if there is not disabled popup selected in the list of floater preferences popups
FirstSelectedDisabledPopups=0
; Return false if there is not enable popup selected in the list of floater preferences popups
FirstSelectedEnabledPopups=0

[Boolean]
; Ignore all notifications so we never need user input on them.
IgnoreAllNotifications=0
; Pop up notifications for all L$ transactions
NotifyMoneyChange=1
; Pop up notifications when receiving L$
NotifyMoneyReceived=1
; Pop up notifications when spending L$
NotifyMoneySpend=1
; Plays a sound when got mentioned in a chat
PlaySoundChatMention=0
; Plays a sound when conference IM received.
PlaySoundConferenceIM=0
; Plays a sound when friend's IM received.
PlaySoundFriendIM=0
; Plays a sound when group chat IM received.
PlaySoundGroupChatIM=0
; Plays a sound when have an incoming voice call.
PlaySoundIncomingVoiceCall=1
; Plays a sound when have an inventory offer.
PlaySoundInventoryOffer=0
; Plays a sound when nearby chat IM received.
PlaySoundNearbyChatIM=0
; Plays a sound when have a new conversation.
PlaySoundNewConversation=1
; Plays a sound when non-friend's IM received.
PlaySoundNonFriendIM=0
; Plays a sound when IM fom an object received.
PlaySoundObjectIM=0
; Plays a sound when have a teleport offer.
PlaySoundTeleportOffer=0
; Display warning messages in chat history
WarningsAsChat=0

[F32]
; Notification channel and World View ratio(0.0 - always show 1 notification, 1.0 - max ratio).
NotificationChannelHeightRatio=0.5
; Length of time that notification tips stay on screen (seconds)
NotifyTipDuration=4.0

[S32]
; Maximum amount of persistent notifications
MaxPersistentNotifications=250
; Space between toasts and a right border of an area where they can appear
NotificationChannelRightMargin=5
; Number of seconds while a notification tip toast exist
NotificationTipToastLifeTime=10
; Number of seconds while a notification toast exists
NotificationToastLifeTime=5
; Height of an overflow toast
OverflowToastHeight=72
; Number of seconds while a StartUp toast exist
StartUpToastLifeTime=5
; Max line count of text message on tip toast.
TipToastMessageLineCount=10
; 
; Default width of buttons in the toast.
; Notes:
; If required width will be less then this one, a button will be reshaped to default size , otherwise to required
; Change of this parameter will affect the layout of buttons in notification toast.
; 
ToastButtonWidth=90
; Number of seconds while a toast is fading
ToastFadingTime=1
; Gap between toasts on a screen (min. value is 5)
ToastGap=7

[String]
; 
; Specifies how the UI responds to Conference IM Notifications.
; Allowed values: [openconversations,toast,flash,noaction]
; 
NotificationConferenceIMOptions=toast
; 
; Specifies how the UI responds to Friend IM Notifications.
; Allowed values: [openconversations,toast,flash,noaction]
; 
NotificationFriendIMOptions=toast
; 
; Specifies how the UI responds to Group Chat Notifications.
; Allowed values: [openconversations,toast,flash,noaction]
; 
NotificationGroupChatOptions=toast
; 
; Specifies how the UI responds to Nearby Chat Notifications.
; Allowed values: [openconversations,toast,flash,noaction]
; 
NotificationNearbyChatOptions=toast
; 
; Specifies how the UI responds to Non Friend IM Notifications.
; Allowed values: [openconversations,toast,flash,noaction]
; 
NotificationNonFriendIMOptions=toast
; 
; Specifies how the UI responds to Object IM Notifications.
; Allowed values: [openconversations,toast,flash,noaction]
; 
NotificationObjectIMOptions=toast
