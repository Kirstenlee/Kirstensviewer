; S24 - auto-converted from settings.xml, category: render_water


[Boolean]
; Render water as transparent.  Setting to false renders water as opaque with a simple texture applied.
RenderTransparentWater=1
; Display water
RenderWater=1
; Use mip maps for water normal map.
RenderWaterMipNormal=1

[F32]
; S24 Advanced - How quickly water color tint ramps in with depth (Beer-Lambert style absorption, per meter). Lower=clearer shallow water with a longer gradient to full tint, Higher=tint appears almost immediately at the shore.
RenderWaterColorAbsorptionRate=0.15
; S24 Advanced - Water color tint Alpha/strength (0.0-1.0). 0.0=no tint, 1.0=full tint effect
RenderWaterColorTintA=1.0
; S24 Advanced - Water color tint Blue channel (0.0-2.0). 1.0=neutral, <1.0=less blue, >1.0=more blue
RenderWaterColorTintB=1.0
; S24 Advanced - Water color tint Green channel (0.0-2.0). 1.0=neutral, <1.0=less green, >1.0=more green
RenderWaterColorTintG=1.0
; S24 Advanced - Water color tint Red channel (0.0-2.0). 1.0=neutral, <1.0=less red, >1.0=more red
RenderWaterColorTintR=1.0
; S24 Advanced - Fresnel power curve for water reflections. HARDCODED as 2.0 (df3*df3) in stock viewer! 1.0=linear soft, 2.0=normal, 4.0=sharp dramatic edges
RenderWaterFresnelPower=2.0
; S24 Advanced - Strength of the horizon atmospheric-haze blend on water (0=off, matches stock crisp horizon). Fades by view angle, not distance, so it only affects water near the horizon, not up close. Below ~3.0 the horizon reads dark (atten dimming dominates over the additive glow); above ~6.0 it overexposes to white. ~4.0 is the sweet spot.
RenderWaterHorizonFadeIntensity=4.0
; S24 - Metallic factor for water surface (0.0 = dielectric glass-like, 1.0 = fully metallic mirror-like). HARDCODED as 1.0 in stock viewer!
RenderWaterMetallic=1.0
; S24 - Direct roughness control for water (0.0 = use environment blur multiplier, 0.01-1.0 = override with this value). Controls surface smoothness.
RenderWaterRoughnessOverride=0.0
; S24 Advanced - Shore transition fade distance. HARDCODED as 60 in stock viewer! Lower=softer beach transition, Higher=sharper rocky coastline
RenderWaterShoreFadeDistance=60.0
; S24 - Intensity multiplier for water specular highlights (sun/moon sparkles). Higher values = brighter highlights.
RenderWaterSpecularIntensity=1.0
; S24 Advanced - Underwater fog density multiplier. Controls underwater visibility independently. 0.3=crystal clear, 1.0=normal, 3.0=very murky
RenderWaterUnderwaterFogMult=1.0
; S24 Advanced - Wave animation speed multiplier. 0.5=slow calm water, 1.0=normal, 2.0=fast stormy water
RenderWaterWaveSpeed=1.0
; S24 Advanced - How much live simulator wind (the same system used for sailing, Develop>Wind Vectors to visualize) blends into water wave direction and animation speed. 0.0=ignore wind entirely, use the EEP water preset's authored direction/speed only (default, preserves creator intent). 1.0=fully follow live wind.
RenderWaterWindInfluence=0.0
; S24 Advanced - Hard ceiling on the live wind vector's own strength before it affects water (only matters when RenderWaterWindInfluence > 0). Limits how much a strong storm/gust can push wave speed/direction regardless of how extreme the simulator's actual wind data gets. 0.0=always treat wind as calm.
RenderWaterWindMagnitudeCap=15.0
; Maps shader water fog density to gl fog density
WaterGLFogDensityScale=0.02
; Controls how dark water gl fog can get
WaterGLFogDepthFloor=0.25
; Controls how quickly gl fog gets dark under water
WaterGLFogDepthScale=50.0

[S32]
; Water planar reflections include materials rendering.
RenderWaterMaterials=0
; Water planar reflection resolution.
RenderWaterRefResolution=512
