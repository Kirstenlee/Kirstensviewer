# =======================================================================
# DXVK CONFIGURATION FOR DX11 ( Kirstens)
# =======================================================================

[Kirstens-S24.exe] # Replace with your exact .exe name if different

# -----------------------------------------------------------------------
# PERFORMANCE & SMOOTHNESS CONFIGURATION
# -----------------------------------------------------------------------

# Enables graphics pipeline caching. Crucial for reducing stutter 
# when loading new player avatars, textures, and assets.
dxvk.enableGraphicsPipelineLibrary = True

# Controls how many threads are used for compiling shaders.
# False allows the driver to use all available CPU cores. Set to True 
# if you notice heavy CPU lag during initial world loading.
# dxvk.numCompilerThreads = False

# Controls how aggressively DXVK allocates memory. 
# "True" can increase performance in asset-heavy scenes, but "False"
# uses less VRAM if users run into out-of-memory crashes.
dxvk.gplAsyncCompilation = True

# Max frame rate limiter. Great for preventing laptops from overheating.
# Uncomment and change '0' to your target FPS (e.g., 60, 144) to limit it.
# dxvk.maxFrameRate = 0
dxgi.maxFrameRate = -1

# -----------------------------------------------------------------------
# COMPATIBILITY & BUG FIXES
# -----------------------------------------------------------------------

# Forces strict asset tracking. MMOs often update textures dynamically.
# Keeping this 'True' prevents weird texture glitches or flickering, 
# though turning it 'False' can give a tiny performance boost.
dxvk.trackAndMapDynamic = True

# Syncs the CPU and GPU timelines. Fixes potential crashes or camera 
# stuttering in older engine architectures like Second Life.
dxvk.useTimelineSemaphores = True


# -----------------------------------------------------------------------
# HUD / ON-SCREEN DISPLAY (OSD) OPTIONS
# -----------------------------------------------------------------------

# Controls the DXVK diagnostic HUD. 
# Default is 'compiler' to show shader compilation progress in the corner.
# Set to 'None' to hide it completely for a clean gameplay experience.
# Set to 'fps,frametimes' if users want to troubleshoot performance.
dxvk.hud = compiler
#dxvk.hud = full

# Scale of the HUD elements on screen. Increase if using a 4K monitor.
# dxvk.hudScale = 1.0